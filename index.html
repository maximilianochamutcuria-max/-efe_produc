<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

.resumen-box {
  background:#f7f7f7;
  padding:12px;
  margin-top:10px;
  border-radius:10px;
}

.ahorro {
  color:green;
  font-size:14px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar"></div>

<!-- CHECKOUT -->
<div id="checkout" style="position:fixed;bottom:0;width:100%;background:white;padding:15px;display:none;z-index:9999;">

  <div style="display:flex;justify-content:space-between;">
    <b>Tu selección</b>
    <span onclick="cerrarCheckout()" style="cursor:pointer;">✖</span>
  </div>

  <div id="resumen"></div>
  <div id="total" style="margin-top:10px;"></div>

</div>

<script>

let seleccionadas = [];
let currentAlbum = "";

/* TOGGLE */
function toggle(div,foto){

  const index = seleccionadas.findIndex(f=> f.foto===foto && f.album===currentAlbum);

  if(index !== -1){
    seleccionadas.splice(index,1);
    div.classList.remove("selected");
  } else {
    seleccionadas.push({foto, album: currentAlbum});
    div.classList.add("selected");
  }

  actualizarBoton();
}

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block" : "none";
  cartBar.innerText = "🛒 " + seleccionadas.length + " fotos";
}

/* CHECKOUT */
function abrirCheckout(){
  checkout.style.display="block";
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

cartBar.onclick = abrirCheckout;

/* 💰 CALCULAR PRECIO REAL */
function calcularPrecio(n){

  let total = 0;

  while(n > 0){
    if(n >= 10){
      total += 12000;
      n -= 10;
    } else if(n >= 7){
      total += 9500;
      n -= 7;
    } else if(n >= 5){
      total += 7500;
      n -= 5;
    } else if(n >= 3){
      total += 5500;
      n -= 3;
    } else {
      total += n * 2000;
      break;
    }
  }

  return total;
}

/* 💸 CALCULAR AHORRO */
function calcularAhorro(cantidad, total){

  const precioNormal = cantidad * 2000;
  return precioNormal - total;
}

/* RENDER */
function renderCheckout(){

  const resumen = document.getElementById("resumen");
  const totalDiv = document.getElementById("total");

  let agrupado = {};
  seleccionadas.forEach(item=>{
    if(!agrupado[item.album]) agrupado[item.album]=[];
    agrupado[item.album].push(item.foto);
  });

  let html="";
  let totalGeneral=0;

  for(let album in agrupado){

    let cantidad = agrupado[album].length;
    let precio = calcularPrecio(cantidad);
    let ahorro = calcularAhorro(cantidad, precio);

    totalGeneral += precio;

    html += `
      <div class="resumen-box">
        <b>${album}</b><br>
        ${cantidad} fotos → $${precio}<br>
        <span class="ahorro">Ahorrás $${ahorro}</span>
      </div>
    `;
  }

  resumen.innerHTML = html;
  totalDiv.innerHTML = "<b>Total: $" + totalGeneral + "</b>";
}

</script>

</body>
</html>
