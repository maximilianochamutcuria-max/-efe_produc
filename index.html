<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; }

/* TITULO */
h1 { text-align:center; }

/* ALBUMES */
.albums {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.album {
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.1);
  transition:0.3s;
}

.album:hover {
  transform:scale(1.03);
}

.album img {
  width:100%;
  height:200px;
  object-fit:cover;
}

.album h3 {
  padding:10px;
}

/* GALERIA PINTEREST */
.gallery {
  column-count:4;
  column-gap:15px;
  padding:20px;
}

.photo {
  margin-bottom:15px;
  position:relative;
  break-inside:avoid;
}

.photo img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.photo:hover img {
  transform:scale(1.03);
  filter:brightness(0.85);
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:10px;
}

.check {
  position:absolute;
  bottom:8px;
  left:8px;
  background:black;
  color:white;
  padding:4px 6px;
  border-radius:6px;
}

/* VISOR */
#viewer {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#viewer img {
  max-width:85%;
  max-height:85%;
}

.nav {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
}

.left { left:20px; }
.right { right:20px; }

.close {
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  color:white;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0;
  width:100%;
  height:80%;
  background:white;
  display:none;
  border-radius:20px 20px 0 0;
  z-index:998;
}

.checkout-body {
  display:flex;
  height:100%;
}

.left-panel {
  flex:1;
  overflow:auto;
  padding:20px;
}

.grid-fotos {
  display:grid;
  grid-template-columns:repeat(auto-fill,80px);
  gap:10px;
}

.item { position:relative; }

.item img {
  width:100%;
  border-radius:8px;
}

.remove {
  position:absolute;
  top:2px;
  right:2px;
  background:red;
  color:white;
  border-radius:50%;
  width:18px;
  height:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
  cursor:pointer;
}

.right-panel {
  width:300px;
  padding:20px;
  background:#f1f1f1;
}

input {
  width:100%;
  margin:5px 0;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.main { background:#009ee3; color:white; }

.cart {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
  z-index:999;
}

/* VOLVER */
.back {
  margin:20px;
  cursor:pointer;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="albums" class="albums"></div>

<div id="gallery" class="gallery" style="display:none;"></div>

<div id="back" class="back" onclick="volver()" style="display:none;">⬅ Volver</div>

<div id="cart" class="cart"></div>

<!-- VISOR -->
<div id="viewer">
  <div class="close" onclick="cerrarViewer()">✖</div>
  <div class="nav left" onclick="prev()">❮</div>
  <img id="viewerImg">
  <div class="nav right" onclick="next()">❯</div>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div class="checkout-body">

    <div class="left-panel">
      <div id="gridFotos" class="grid-fotos"></div>
      <div onclick="vaciar()">🗑 Limpiar</div>
    </div>

    <div class="right-panel">
      <div id="total"></div>

      <h3>Datos</h3>
      <input id="email" placeholder="Email">
      <input placeholder="Teléfono">

      <button class="main" onclick="pagar()">Continuar</button>
      <button onclick="cerrarCheckout()">Cerrar</button>
    </div>

  </div>
</div>

<script>

let fotos = [];
let seleccion = [];
let albumActual = "";
let indexActual = 0;

/* PRECIO */
function precio(n){
  let t=0;
  if(n>=10){ t+=12000; n-=10; }
  if(n>=3){ t+=5500; n-=3; }
  t+=n*2000;
  return t;
}

/* CARGAR ALBUMES */
async function cargarAlbums(){
  const res = await fetch("/api/albums");
  const albums = await res.json();

  const cont = document.getElementById("albums");

  albums.forEach(a=>{
    const div=document.createElement("div");
    div.className="album";

    div.innerHTML=`
      <img src="/images/${a}/preview/${a}_1.jpg">
      <h3>${a}</h3>
    `;

    div.onclick=()=>abrirAlbum(a);

    cont.appendChild(div);
  });
}

/* ABRIR ALBUM */
async function abrirAlbum(nombre){

  albumActual = nombre;

  albums.style.display="none";
  gallery.style.display="block";
  back.style.display="block";

  const res = await fetch(`/api/fotos/${nombre}`);
  fotos = await res.json();

  gallery.innerHTML="";

  fotos.forEach((f,i)=>{
    const div=document.createElement("div");
    div.className="photo";

    div.innerHTML=`
      <img src="/images/${nombre}/preview/${f}" onclick="abrir(${i})">
      <div class="check">+</div>
    `;

    div.onclick=(e)=>{
      if(e.target.tagName !== "IMG"){
        toggle(div,f);
      }
    };

    gallery.appendChild(div);
  });
}

/* VOLVER */
function volver(){
  gallery.style.display="none";
  albums.style.display="grid";
  back.style.display="none";
}

/* SELECCION */
function toggle(div,f){
  const existe = seleccion.includes(f);

  if(existe){
    seleccion = seleccion.filter(x=>x!==f);
    div.classList.remove("selected");
  } else {
    seleccion.push(f);
    div.classList.add("selected");
  }

  actualizar();
}

/* VISOR */
function abrir(i){
  indexActual=i;
  viewer.style.display="flex";
  viewerImg.src=`/images/${albumActual}/preview/${fotos[i]}`;
}

function cerrarViewer(){ viewer.style.display="none"; }
function next(){ indexActual=(indexActual+1)%fotos.length; abrir(indexActual); }
function prev(){ indexActual=(indexActual-1+fotos.length)%fotos.length; abrir(indexActual); }

/* CARRITO */
function actualizar(){
  cart.style.display = seleccion.length?"block":"none";
  cart.innerText = seleccion.length+" fotos";
}

cart.onclick=()=>{
  checkout.style.display="block";
  renderCheckout();
};

function cerrarCheckout(){ checkout.style.display="none"; }

/* CHECKOUT */
function renderCheckout(){
  gridFotos.innerHTML="";

  seleccion.forEach(f=>{
    const d=document.createElement("div");
    d.className="item";

    d.innerHTML=`
      <img src="/images/${albumActual}/preview/${f}">
      <div class="remove" onclick="remove('${f}')">✖</div>
    `;

    gridFotos.appendChild(d);
  });

  total.innerHTML=`<b>Total: $${precio(seleccion.length)}</b>`;
}

/* REMOVE */
function remove(f){
  seleccion = seleccion.filter(x=>x!==f);
  renderCheckout();
  actualizar();
}

function vaciar(){
  seleccion=[];
  renderCheckout();
  actualizar();
}

/* PAGO */
function pagar(){

  const email=document.getElementById("email").value;

  if(!email){
    alert("Ingresá email");
    return;
  }

  const total = precio(seleccion.length);

  fetch("/crear-pago",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ total })
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.init_point){
      alert("Error en pago");
      return;
    }
    window.location.href = d.init_point;
  })
  .catch(()=>{
    alert("Error conexión backend");
  });
}

/* INIT */
cargarAlbums();

</script>

</body>
</html>
