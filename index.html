<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery {
  column-count:4;
  column-gap:15px;
  padding:20px;
}

.photo {
  position:relative;
  margin-bottom:15px;
}

.photo img {
  width:100%;
  border-radius:12px;
  cursor:pointer;
}

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  background:rgba(0,0,0,0.5);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  z-index:2;
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
  pointer-events:none;
}

/* CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:15px 25px;
  border-radius:20px;
  display:none;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  inset:0;
  background:white;
  display:none;
  flex-direction:column;
  z-index:9999;
}

.step { display:none; }
.step.active { display:block; }

.btn {
  padding:12px;
  margin:10px auto;
  width:200px;
  display:block;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- CHECKOUT -->
<div id="checkout">

  <!-- PASO 1 -->
  <div id="step1" class="step active">
    <div id="resumen" style="padding:20px;"></div>
    <div id="total" style="padding:20px;"></div>

    <button class="btn" onclick="irAPago()">Siguiente</button>
  </div>

  <!-- PASO 2 -->
  <div id="step2" class="step">
    <button class="btn" onclick="pagarMercadoPago()">Mercado Pago</button>
    <button class="btn">Transferencia</button>
  </div>

  <button class="btn" onclick="cerrarCheckout()">Cerrar</button>

</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = [];
let currentAlbum = "";
let totalGlobal = 0;

/* LINKS */
const LINKS = {
  2000:"LINK_2000",
  5500:"LINK_5500",
  7500:"LINK_7500",
  9500:"LINK_9500",
  12000:"LINK_12000"
};

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block":"none";
  cartBar.innerText = "🛒 "+seleccionadas.length+" fotos";
}

/* CHECKOUT */
function abrirCheckout(){
  checkout.style.display="flex";
  mostrarPaso(1);
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

function mostrarPaso(n){
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById("step"+n).classList.add("active");
}

function irAPago(){
  mostrarPaso(2);
}

/* PRECIO */
function calcularPrecio(n){
  let total=0;
  while(n>0){
    if(n>=10){total+=12000;n-=10;}
    else if(n>=7){total+=9500;n-=7;}
    else if(n>=5){total+=7500;n-=5;}
    else if(n>=3){total+=5500;n-=3;}
    else {total+=n*2000;break;}
  }
  return total;
}

/* LINKS */
function generarLinksPago(total){
  let links=[];
  while(total>0){
    if(total>=12000){links.push(LINKS[12000]);total-=12000;}
    else if(total>=9500){links.push(LINKS[9500]);total-=9500;}
    else if(total>=7500){links.push(LINKS[7500]);total-=7500;}
    else if(total>=5500){links.push(LINKS[5500]);total-=5500;}
    else {links.push(LINKS[2000]);total-=2000;}
  }
  return links;
}

function pagarMercadoPago(){
  generarLinksPago(totalGlobal).forEach(l=>window.open(l));
}

/* RENDER */
function renderCheckout(){
  let agrupado={};

  seleccionadas.forEach(i=>{
    if(!agrupado[i.album]) agrupado[i.album]=[];
    agrupado[i.album].push(i.foto);
  });

  let total=0, html="";

  for(let a in agrupado){
    let c=agrupado[a].length;
    let p=calcularPrecio(c);
    total+=p;

    html+=`<b>${a}</b> - ${c} fotos → $${p}<br>`;
  }

  totalGlobal=total;

  resumen.innerHTML=html;
  total.innerHTML="<b>Total: $"+total+"</b>";
}

/* ÁLBUMES */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML="";
  albums.forEach(album=>{
    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=album;
    div.onclick=()=>abrirAlbum(album);
    app.appendChild(div);
  });
}

/* GALERÍA */
async function abrirAlbum(nombre){
  currentAlbum=nombre;

  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML='<div class="gallery" id="gallery"></div>';
  const gallery=document.getElementById("gallery");

  fotos.forEach(foto=>{
    const div=document.createElement("div");
    div.className="photo";

    const img=document.createElement("img");
    img.src=`/images/${nombre}/preview/${foto}`;

    const check=document.createElement("div");
    check.className="checkbox";

    check.onclick=(e)=>{
      e.stopPropagation();
      toggle(div,foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* TOGGLE */
function toggle(div,foto){
  const i=seleccionadas.findIndex(f=>f.foto===foto && f.album===currentAlbum);

  if(i!==-1){
    seleccionadas.splice(i,1);
    div.classList.remove("selected");
  } else {
    seleccionadas.push({foto,album:currentAlbum});
    div.classList.add("selected");
  }

  actualizarBoton();
}

cartBar.onclick=abrirCheckout;

mostrarAlbums();

</script>

</body>
</html>
