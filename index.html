<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

h1 {
  text-align: center;
  margin: 30px 0;
}

/* GRID ÁLBUMES */
.home-container {
  display: grid;
  grid-template-columns: repeat(4, 260px);
  gap: 30px;
  padding-left: 40px;
}

.album-card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}

.album-card:hover {
  transform: scale(1.03);
}

.album-title {
  font-size: 15px;
  font-weight: bold;
}

.album-count {
  color: gray;
  margin: 5px 0 10px;
  font-size: 14px;
}

.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

/* GALERÍA */
.gallery-container {
  max-width: 1200px;
  margin: auto;
}

.back-btn {
  margin: 20px 0;
  padding: 10px 15px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  display: inline-block;
}

/* PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

.photo {
  break-inside: avoid;
  margin-bottom: 15px;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

.photo img:hover {
  transform: scale(1.05);
}

/* 🔥 MODAL FIX */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>
<div id="app"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

// 🔥 CARGAR ÁLBUMES
async function mostrarAlbums() {
  const app = document.getElementById("app");

  const res = await fetch("/api/albums");
  const albums = await res.json();

  app.innerHTML = `<div class="home-container" id="albums"></div>`;
  const cont = document.getElementById("albums");

  for (const album of albums) {

    const fotosRes = await fetch(`/api/fotos/${album}`);
    const fotos = await fotosRes.json();

    const preview = fotos[0];

    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <div class="album-title">${album.replaceAll("_", " ")}</div>
      <div class="album-count">${fotos.length} Fotos</div>
      <img src="/images/${album}/preview/${preview}">
    `;

    div.onclick = () => abrirAlbum(album);

    cont.appendChild(div);
  }
}

// 📸 ABRIR ÁLBUM
async function abrirAlbum(nombre) {
  const app = document.getElementById("app");

  const res = await fetch(`/api/fotos/${nombre}`);
  const fotos = await res.json();

  app.innerHTML = `
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");

    img.src = `/images/${nombre}/preview/${foto}`;

    img.onclick = () => abrirModal(`/images/${nombre}/watermarked/${foto}`);

    div.appendChild(img);
    gallery.appendChild(div);
  });
}

// 🔥 MODAL FIX
function abrirModal(src) {
  const modal = document.getElementById("modal");
  const img = document.getElementById("modalImg");

  img.src = src;
  modal.style.display = "flex";

  document.body.style.overflow = "hidden";
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "auto";
}

// INIT
mostrarAlbums();

</script>

</body>
</html>
