<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* TODO TU CSS ORIGINAL (no lo toco) */

.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:18px 30px;
  border-radius:20px;
  display:none;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  inset:0;
  background:white;
  display:none;
  flex-direction:column;
  z-index:99999;
}

.checkout-header {
  padding:15px;
  border-bottom:1px solid #ddd;
}

/* PASOS */
.step { display:none; }
.step.active { display:block; }

/* BOTONES */
.btn-pago {
  width:220px;
  margin:10px auto;
  padding:15px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  display:block;
  cursor:pointer;
  font-size:16px;
}

.cerrar {
  text-align:center;
  margin:20px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- CHECKOUT -->
<div id="checkout">

  <div class="checkout-header">
    <b>Carrito</b>
  </div>

  <!-- PASO 1 -->
  <div id="step1" class="step active">
    <div id="resumen" style="padding:20px;"></div>
    <div id="total" style="padding:20px;"></div>

    <button class="btn-pago" onclick="irAPago()">
      Siguiente
    </button>
  </div>

  <!-- PASO 2 -->
  <div id="step2" class="step">

    <div style="text-align:center; margin-top:60px;">
      <button class="btn-pago" onclick="pagarMercadoPago()">
        Mercado Pago
      </button>

      <button class="btn-pago" onclick="alert('Después agregamos transferencia')">
        Transferencia
      </button>

      <div style="margin-top:20px; font-size:12px;">
        Términos y Condiciones<br>
        Políticas de privacidad
      </div>
    </div>

  </div>

  <div class="cerrar">
    <button onclick="cerrarCheckout()">Cerrar</button>
  </div>

</div>

<script>

const cartBar = document.getElementById("cartBar");

let seleccionadas = [];
let currentAlbum = "";
let totalGlobal = 0;

/* LINKS MP */
const LINKS = {
  2000: "PEGAR_LINK_2000",
  5500: "PEGAR_LINK_5500",
  7500: "PEGAR_LINK_7500",
  9500: "PEGAR_LINK_9500",
  12000: "PEGAR_LINK_12000"
};

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block" : "none";
  cartBar.innerText = "🛒 " + seleccionadas.length + " fotos";
}

/* CHECKOUT */
const checkout = document.getElementById("checkout");

cartBar.onclick = ()=> abrirCheckout();

function abrirCheckout(){
  checkout.style.display="flex";
  mostrarPaso(1);
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

function mostrarPaso(n){
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById("step"+n).classList.add("active");
}

function irAPago(){
  mostrarPaso(2);
}

/* PRECIO */
function calcularPrecio(n){
  let total = 0;

  while(n > 0){
    if(n >= 10){ total += 12000; n -= 10; }
    else if(n >= 7){ total += 9500; n -= 7; }
    else if(n >= 5){ total += 7500; n -= 5; }
    else if(n >= 3){ total += 5500; n -= 3; }
    else { total += n * 2000; break; }
  }

  return total;
}

/* LINKS */
function generarLinksPago(total){

  let links = [];

  while(total > 0){
    if(total >= 12000){ links.push(LINKS[12000]); total -= 12000; }
    else if(total >= 9500){ links.push(LINKS[9500]); total -= 9500; }
    else if(total >= 7500){ links.push(LINKS[7500]); total -= 7500; }
    else if(total >= 5500){ links.push(LINKS[5500]); total -= 5500; }
    else { links.push(LINKS[2000]); total -= 2000; }
  }

  return links;
}

/* PAGAR */
function pagarMercadoPago(){
  const links = generarLinksPago(totalGlobal);
  links.forEach(link=> window.open(link));
}

/* RENDER */
function renderCheckout(){

  const resumen = document.getElementById("resumen");
  const totalDiv = document.getElementById("total");

  let agrupado = {};
  seleccionadas.forEach(item=>{
    if(!agrupado[item.album]) agrupado[item.album]=[];
    agrupado[item.album].push(item.foto);
  });

  let total = 0;
  let html="";

  for(let album in agrupado){
    let cantidad = agrupado[album].length;
    let precio = calcularPrecio(cantidad);
    total += precio;

    html += `<b>${album}</b> - ${cantidad} fotos → $${precio}<br><br>`;
  }

  totalGlobal = total;

  resumen.innerHTML = html;
  totalDiv.innerHTML = "<b>Total: $" + total + "</b>";
}

</script>

</body>
</html>
