<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #000;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  padding: 20px;
}

.card {
  cursor: pointer;
}

.card img {
  width: 100%;
  border-radius: 10px;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  z-index: 999;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.modal img {
  max-width: 90%;
  max-height: 80%;
  pointer-events: none; /* evita arrastrar */
}

.cerrar {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 30px;
  cursor: pointer;
}

/* WATERMARK */
.watermark {
  position: absolute;
  color: rgba(255,255,255,0.2);
  font-size: 40px;
  transform: rotate(-30deg);
  pointer-events: none;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="albums"></div>

<div class="grid" id="gallery"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cerrarModal()">
  <span class="cerrar">✖</span>
  <img id="modalImg">
  <div class="watermark">@efe_produc</div>
</div>

<script>

const base = "images";

// 🚀 CARGAR ALBUMES
async function cargarAlbumes() {
  const res = await fetch(base);
  const text = await res.text();

  const parser = new DOMParser();
  const html = parser.parseFromString(text, "text/html");
  const links = html.querySelectorAll("a");

  const albumsDiv = document.getElementById("albums");

  links.forEach(link => {
    const name = link.getAttribute("href");

    if(name !== "../") {
      const btn = document.createElement("button");
      btn.innerText = name.replace("/", "");
      btn.onclick = () => cargarFotos(name.replace("/", ""));
      albumsDiv.appendChild(btn);
    }
  });
}

// 🚀 CARGAR FOTOS (USA PREVIEW)
async function cargarFotos(album) {
  const res = await fetch(`${base}/${album}/preview`);
  const text = await res.text();

  const parser = new DOMParser();
  const html = parser.parseFromString(text, "text/html");
  const links = html.querySelectorAll("a");

  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  links.forEach(link => {
    const file = link.getAttribute("href");

    if(file.endsWith(".jpg") || file.endsWith(".png")) {

      const div = document.createElement("div");
      div.className = "card";

      const img = document.createElement("img");
      img.src = `${base}/${album}/preview/${file}`;

      // ❌ bloquear click derecho
      img.oncontextmenu = () => false;

      div.onclick = () => abrirModal(img.src);

      div.appendChild(img);
      gallery.appendChild(div);
    }
  });
}

// MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// INIT
cargarAlbumes();

</script>

</body>
</html>
