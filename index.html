<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 20px;
}

#albums button {
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 10px;
  padding: 20px;
}

.card img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
}

/* CONTENEDOR FOTO */
.modal-content {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

/* FOTO GRANDE */
.modal img {
  width: 100%;
  max-height: 90vh;
  border-radius: 10px;
}

/* 🔥 MARCA DE AGUA */
.watermark {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;

  background-image: url('logo.png');
  background-repeat: repeat;
  background-size: 200px;
  opacity: 0.15;
}

/* TEXTO REPETIDO */
.watermark::after {
  content: "@efe_produc";
  position: absolute;
  width: 100%;
  height: 100%;
  color: white;
  font-size: 40px;
  opacity: 0.2;

  display: flex;
  flex-wrap: wrap;
  align-content: space-around;
  justify-content: space-around;
}

</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="albums"></div>
<div class="grid" id="gallery"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cerrarModal()">
  <div class="modal-content">
    <img id="modalImg">
    <div class="watermark"></div>
  </div>
</div>

<script>
const albums = ["gymna_vs_cariocas"];

function cargarAlbums() {
  const cont = document.getElementById("albums");
  albums.forEach(album => {
    const btn = document.createElement("button");
    btn.innerText = album;
    btn.onclick = () => cargarFotos(album);
    cont.appendChild(btn);
  });
}

async function cargarFotos(album) {
  const res = await fetch(`/api/fotos/${album}`);
  const fotos = await res.json();

  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "card";

    const img = document.createElement("img");

    // 🔥 SIN MARCA DE AGUA EN GRID
    img.src = `/images/${album}/preview/${foto}`;

    img.onclick = () => abrirModal(`/images/${album}/original/${foto}`);

    div.appendChild(img);
    gallery.appendChild(div);
  });
}

function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

cargarAlbums();
</script>

</body>
</html>
