<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

h1 {
  text-align: center;
  margin: 30px;
}

.home-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, 260px);
  gap: 30px;
  padding: 40px;
}

.album-card {
  background: white;
  padding: 15px;
  border-radius: 12px;
  cursor: pointer;
}

.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

.gallery {
  column-count: 4;
  column-gap: 15px;
  padding: 20px;
}

.photo {
  position: relative;
  margin-bottom: 15px;
  cursor: pointer;
}

.photo img {
  width: 100%;
  border-radius: 12px;
}

.photo.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.4);
  border-radius: 12px;
}

.cart-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: black;
  color: white;
  padding: 18px 30px;
  border-radius: 20px;
  display: none;
  font-size: 18px;
  cursor: pointer;
}

.checkout {
  position: fixed;
  inset: 0;
  background: white;
  z-index: 9999;
  padding: 30px;
  overflow: auto;
  display: none;
}

.grid-mini {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.grid-mini img {
  width: 100px;
  border-radius: 10px;
}

.total {
  font-size: 20px;
  margin: 20px 0;
}

.btn {
  background: black;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  margin-top: 10px;
}

input {
  padding: 10px;
  width: 250px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>

<div id="cartBar" class="cart-bar"></div>

<div id="checkout" class="checkout">
  <h2>Carrito</h2>

  <div id="miniaturas" class="grid-mini"></div>

  <button class="btn" onclick="limpiar()">🗑 Limpiar carrito</button>

  <div class="total" id="total"></div>

  <h3>Enviar fotos</h3>
  <input placeholder="Email"><br><br>
  <input placeholder="Teléfono"><br><br>

  <button class="btn">Finalizar compra</button>
  <br><br>
  <button onclick="cerrarCheckout()">Cerrar</button>
</div>

<script>

let seleccionadas = new Set();
let albumActual = "";

function actualizarBoton(){
  const btn = document.getElementById("cartBar");

  if(seleccionadas.size > 0){
    btn.style.display = "block";
    btn.innerText = "🛒 Finalizar (" + seleccionadas.size + ")";
  } else {
    btn.style.display = "none";
  }
}

document.getElementById("cartBar").onclick = abrirCheckout;

async function mostrarAlbums(){
  const app = document.getElementById("app");

  const res = await fetch("/api/albums");
  const albums = await res.json();

  app.innerHTML = `<div class="home-container"></div>`;
  const cont = app.firstChild;

  for(const album of albums){
    const fotos = await (await fetch(`/api/fotos/${album}`)).json();

    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <b>${album.replaceAll("_"," ")}</b>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;

    div.onclick = () => abrirAlbum(album);
    cont.appendChild(div);
  }
}

async function abrirAlbum(nombre){
  albumActual = nombre;

  const app = document.getElementById("app");
  const fotos = await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML = `<div class="gallery" id="gallery"></div>`;
  const g = document.getElementById("gallery");

  fotos.forEach(f => {
    const d = document.createElement("div");
    d.className = "photo";

    d.innerHTML = `<img src="/images/${nombre}/preview/${f}">`;

    d.onclick = () => toggle(d, f);

    g.appendChild(d);
  });
}

function toggle(div, foto){
  if(div.classList.contains("selected")){
    div.classList.remove("selected");
    seleccionadas.delete(foto);
  } else {
    div.classList.add("selected");
    seleccionadas.add(foto);
  }
  actualizarBoton();
}

function abrirCheckout(){
  const panel = document.getElementById("checkout");
  const mini = document.getElementById("miniaturas");

  mini.innerHTML = "";

  seleccionadas.forEach(f => {
    const img = document.createElement("img");
    img.src = `/images/${albumActual}/preview/${f}`;
    mini.appendChild(img);
  });

  document.getElementById("total").innerText =
    "Total: $" + (seleccionadas.size * 2000);

  panel.style.display = "block";
}

function cerrarCheckout(){
  document.getElementById("checkout").style.display = "none";
}

function limpiar(){
  seleccionadas.clear();
  actualizarBoton();
  cerrarCheckout();
}

mostrarAlbums();

</script>

</body>
</html>
