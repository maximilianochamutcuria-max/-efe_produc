<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; }
h1 { text-align:center; }

/* GALERÍA */
.gallery {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
  padding:20px;
}

.photo {
  position:relative;
}

.photo img {
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:10px;
}

/* CHECK */
.check {
  position:absolute;
  bottom:8px;
  left:8px;
  background:black;
  color:white;
  padding:4px 6px;
  border-radius:6px;
}

/* VISOR */
#viewer {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  align-items:center;
  justify-content:center;
}

#viewer img {
  max-width:80%;
  max-height:80%;
}

.nav {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:40px;
  color:white;
  cursor:pointer;
}

.left { left:20px; }
.right { right:20px; }

.close {
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  color:white;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0;
  width:100%;
  height:80%;
  background:white;
  display:none;
  border-radius:20px 20px 0 0;
}

.checkout-body {
  display:flex;
  height:100%;
}

.left-panel {
  flex:1;
  overflow:auto;
  padding:20px;
}

.grid-fotos {
  display:grid;
  grid-template-columns:repeat(auto-fill,80px);
  gap:10px;
}

.item { position:relative; }

.item img {
  width:100%;
  border-radius:8px;
}

.remove {
  position:absolute;
  top:2px;
  right:2px;
  background:red;
  color:white;
  border-radius:50%;
  width:18px;
  height:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:12px;
  cursor:pointer;
}

.right-panel {
  width:300px;
  padding:20px;
  background:#f1f1f1;
}

input {
  width:100%;
  margin:5px 0;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  width:100%;
  padding:10px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.main { background:#009ee3; color:white; }

.cart {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="gallery" class="gallery"></div>
<div id="cart" class="cart"></div>

<!-- VISOR -->
<div id="viewer">
  <div class="close" onclick="cerrarViewer()">✖</div>
  <div class="nav left" onclick="prev()">❮</div>
  <img id="viewerImg">
  <div class="nav right" onclick="next()">❯</div>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div class="checkout-body">

    <div class="left-panel">
      <div id="gridFotos" class="grid-fotos"></div>
      <div onclick="vaciar()">🗑 Limpiar</div>
    </div>

    <div class="right-panel">
      <div id="detalle"></div>
      <div id="total"></div>

      <h3>Datos</h3>
      <input id="email" placeholder="Email">
      <input placeholder="Teléfono">
      <input placeholder="Código">

      <button class="main" onclick="pagar()">Continuar</button>
      <button onclick="cerrarCheckout()">Cerrar</button>
    </div>

  </div>
</div>

<script>

let fotos = [];
let seleccion = [];
let indexActual = 0;

/* PRECIO */
function precio(n){
  let t=0;
  if(n>=10){ t+=12000; n-=10; }
  if(n>=3){ t+=5500; n-=3; }
  t+=n*2000;
  return t;
}

/* CARGAR */
async function cargar(){
  const res = await fetch("/api/fotos/gymna_vs_cariocas");
  fotos = await res.json();

  const g = document.getElementById("gallery");

  fotos.forEach((f,i)=>{
    const div=document.createElement("div");
    div.className="photo";

    div.innerHTML=`
      <img src="/images/gymna_vs_cariocas/preview/${f}">
      <div class="check">+</div>
    `;

    div.onclick=()=>toggle(div,f,i);
    g.appendChild(div);
  });
}

function toggle(div,f,i){
  indexActual=i;

  const existe = seleccion.find(x=>x===f);

  if(existe){
    seleccion = seleccion.filter(x=>x!==f);
    div.classList.remove("selected");
  } else {
    seleccion.push(f);
    div.classList.add("selected");
  }

  actualizar();
}

/* VISOR */
function abrir(i){
  indexActual=i;
  viewer.style.display="flex";
  viewerImg.src=`/images/gymna_vs_cariocas/preview/${fotos[i]}`;
}

function cerrarViewer(){ viewer.style.display="none"; }
function next(){ indexActual=(indexActual+1)%fotos.length; abrir(indexActual); }
function prev(){ indexActual=(indexActual-1+fotos.length)%fotos.length; abrir(indexActual); }

/* BOTÓN */
function actualizar(){
  cart.style.display = seleccion.length?"block":"none";
  cart.innerText = seleccion.length+" fotos";
}

cart.onclick=()=>{
  checkout.style.display="block";
  renderCheckout();
};

function cerrarCheckout(){ checkout.style.display="none"; }

/* CHECKOUT */
function renderCheckout(){

  gridFotos.innerHTML="";
  detalle.innerHTML="";

  seleccion.forEach(f=>{
    const d=document.createElement("div");
    d.className="item";

    d.innerHTML=`
      <img src="/images/gymna_vs_cariocas/preview/${f}">
      <div class="remove" onclick="remove('${f}')">✖</div>
    `;

    gridFotos.appendChild(d);
  });

  let t=precio(seleccion.length);

  detalle.innerHTML=`${seleccion.length} fotos`;
  total.innerHTML=`<b>Total: $${t}</b>`;
}

/* REMOVE */
function remove(f){
  seleccion = seleccion.filter(x=>x!==f);
  renderCheckout();
  actualizar();
}

function vaciar(){
  seleccion=[];
  renderCheckout();
  actualizar();
}

/* PAGO */
function pagar(){

  const email=document.getElementById("email").value;

  if(!email){
    alert("Ingresá email");
    return;
  }

  const total = precio(seleccion.length);

  fetch("/crear-pago",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ total })
  })
  .then(r=>r.json())
  .then(d=>{
    if(!d.init_point){
      alert("Error en pago");
      return;
    }
    window.location.href = d.init_point;
  });
}

cargar();

</script>

</body>
</html>
