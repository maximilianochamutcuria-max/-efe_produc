<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
  justify-content:center;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery { column-count:4; column-gap:15px; }
.photo { position:relative; margin-bottom:15px; }
.photo img { width:100%; border-radius:12px; cursor:pointer; }

.checkbox {
  position:absolute; bottom:10px; left:10px;
  width:26px; height:26px;
  background:rgba(0,0,0,0.6);
  color:white; display:flex; align-items:center; justify-content:center;
  border-radius:6px;
}

.photo.selected::after {
  content:""; position:absolute; inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0; left:0;
  width:100%; height:85%;
  background:white;
  border-radius:20px 20px 0 0;
  display:none;
}

.checkout-body { display:flex; height:100%; }

.grid-fotos {
  display:grid;
  grid-template-columns:repeat(auto-fill,100px);
  gap:10px;
}

.item {
  position:relative;
}

.item img {
  width:100%;
  border-radius:10px;
}

.remove {
  position:absolute;
  top:5px; right:5px;
  background:red;
  color:white;
  border-radius:50%;
  width:20px; height:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:12px;
}

.right {
  padding:20px;
  width:300px;
  background:#f7f7f7;
}

input {
  width:100%;
  padding:10px;
  margin:5px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  padding:12px;
  width:100%;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.btn-main { background:#009ee3; color:white; }

.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<div id="checkout">
  <div class="checkout-body">

    <div style="flex:1;padding:20px;overflow:auto;">
      <div id="gridFotos" class="grid-fotos"></div>
      <div style="color:red;cursor:pointer" onclick="vaciarCarrito()">🗑 Limpiar carrito</div>
    </div>

    <div class="right">
      <div id="detalle"></div>
      <div id="total"></div>

      <h3>Enviar fotos</h3>
      <input id="email" placeholder="Email">
      <input placeholder="Teléfono">
      <input placeholder="Código descuento">

      <button class="btn-main" onclick="irAPago()">Continuar</button>
      <button onclick="cerrarCheckout()">Cerrar</button>
    </div>

  </div>
</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = [];
let currentAlbum = "";
let totalGlobal = 0;

/* PRECIO CORREGIDO */
function calcularPrecio(n){
  let total=0;

  if(n>=10){
    total += 12000;
    n -= 10;
  }

  if(n>=3){
    total += 5500;
    n -= 3;
  }

  total += n*2000;

  return total;
}

/* CHECKOUT */
function renderCheckout(){

  const grid=document.getElementById("gridFotos");
  const detalle=document.getElementById("detalle");
  const totalDiv=document.getElementById("total");

  grid.innerHTML="";
  detalle.innerHTML="";

  let agrupado={}, total=0;

  seleccionadas.forEach(i=>{
    if(!agrupado[i.album]) agrupado[i.album]=[];
    agrupado[i.album].push(i.foto);
  });

  for(let album in agrupado){

    agrupado[album].forEach(f=>{
      const div=document.createElement("div");
      div.className="item";

      div.innerHTML=`
        <img src="/images/${album}/preview/${f}">
        <div class="remove" onclick="eliminarFoto('${album}','${f}')">✖</div>
      `;

      grid.appendChild(div);
    });

    let c=agrupado[album].length;
    let p=calcularPrecio(c);
    total+=p;

    detalle.innerHTML+=`<b>${album}</b><br>${c} fotos → $${p}<br><br>`;
  }

  totalGlobal=total;
  totalDiv.innerHTML="<b>Total: $"+total+"</b>";
}

function eliminarFoto(album,foto){
  seleccionadas = seleccionadas.filter(f=>!(f.album===album && f.foto===foto));
  renderCheckout();
  actualizarBoton();
}

function vaciarCarrito(){
  seleccionadas=[];
  renderCheckout();
  actualizarBoton();
}

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block":"none";
  cartBar.innerText = "🛒 "+seleccionadas.length+" fotos";
}

cartBar.onclick = ()=>{
  checkout.style.display="block";
  renderCheckout();
};

function cerrarCheckout(){
  checkout.style.display="none";
}

function irAPago(){
  const email = document.getElementById("email").value;

  if(!email){
    alert("Ingresá tu email");
    return;
  }

  fetch("/crear-pago",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ total: totalGlobal })
  })
  .then(r=>r.json())
  .then(data=>{
    window.location.href = data.init_point;
  });
}

/* ÁLBUMES */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML=`<div class="home-container"></div>`;
  const cont=app.firstChild;

  for(const album of albums){
    const fotos=await (await fetch(`/api/fotos/${album}`)).json();

    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=`
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick=()=>abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* GALERÍA */
async function abrirAlbum(nombre){
  currentAlbum=nombre;

  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML=`<div class="gallery" id="gallery"></div>`;
  const gallery=document.getElementById("gallery");

  fotos.forEach(foto=>{
    const div=document.createElement("div");
    div.className="photo";

    div.innerHTML=`
      <img src="/images/${nombre}/preview/${foto}">
      <div class="checkbox"></div>
    `;

    div.onclick=()=>toggle(div,foto);

    gallery.appendChild(div);
  });
}

function toggle(div,foto){
  const i=seleccionadas.findIndex(f=>f.foto===foto && f.album===currentAlbum);

  if(i!==-1){
    seleccionadas.splice(i,1);
    div.classList.remove("selected");
  } else {
    seleccionadas.push({foto,album:currentAlbum});
    div.classList.add("selected");
  }

  actualizarBoton();
}

mostrarAlbums();

</script>

</body>
</html>
