<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

h1 {
  text-align: center;
  margin: 30px 0;
}

/* GRID ÁLBUMES */
.home-container {
  display: grid;
  grid-template-columns: repeat(4, 260px);
  gap: 30px;
  padding-left: 40px;
}

.album-card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
  cursor: pointer;
}

.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

/* GALERÍA */
.gallery-container {
  max-width: 1200px;
  margin: auto;
}

.back-btn {
  margin: 20px 0;
  padding: 10px 15px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
  display: inline-block;
}

/* PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

.photo {
  position: relative;
  break-inside: avoid;
  margin-bottom: 15px;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

.photo img:hover {
  transform: scale(1.03);
}

/* 🔲 CHECKBOX */
.checkbox {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 26px;
  height: 26px;
  border: 2px solid white;
  border-radius: 6px;
  background: rgba(0,0,0,0.5);
  cursor: pointer;
  z-index: 2;
}

/* ✔ ACTIVO */
.photo.selected .checkbox {
  background: black;
}

/* ✔ ICONO */
.photo.selected .checkbox::after {
  content: "✔";
  color: white;
  position: absolute;
  top: 2px;
  left: 5px;
  font-size: 16px;
}

/* 🔴 OVERLAY ROJO */
.photo.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.4);
  border-radius: 12px;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>
<div id="app"></div>

<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

// 🧠 fotos seleccionadas
let seleccionadas = new Set();

// 🔥 ÁLBUMES
async function mostrarAlbums() {
  const app = document.getElementById("app");

  const res = await fetch("/api/albums");
  const albums = await res.json();

  app.innerHTML = `<div class="home-container" id="albums"></div>`;
  const cont = document.getElementById("albums");

  for (const album of albums) {

    const fotosRes = await fetch(`/api/fotos/${album}`);
    const fotos = await fotosRes.json();

    const preview = fotos[0];

    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <b>${album.replaceAll("_"," ")}</b>
      <div>${fotos.length} Fotos</div>
      <img src="/images/${album}/preview/${preview}">
    `;

    div.onclick = () => abrirAlbum(album);
    cont.appendChild(div);
  }
}

// 📸 ABRIR ÁLBUM
async function abrirAlbum(nombre) {
  const app = document.getElementById("app");

  const res = await fetch(`/api/fotos/${nombre}`);
  const fotos = await res.json();

  app.innerHTML = `
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");
    img.src = `/images/${nombre}/preview/${foto}`;
    img.onclick = () => abrirModal(`/images/${nombre}/watermarked/${foto}`);

    const checkbox = document.createElement("div");
    checkbox.className = "checkbox";

    checkbox.onclick = (e) => {
      e.stopPropagation();

      if (div.classList.contains("selected")) {
        div.classList.remove("selected");
        seleccionadas.delete(foto);
      } else {
        div.classList.add("selected");
        seleccionadas.add(foto);
      }
    };

    div.appendChild(img);
    div.appendChild(checkbox);
    gallery.appendChild(div);
  });
}

// 🔥 MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
  document.body.style.overflow = "hidden";
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
  document.body.style.overflow = "auto";
}

// INIT
mostrarAlbums();

</script>

</body>
</html>
