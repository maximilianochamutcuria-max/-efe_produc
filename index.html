<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

h1 {
  text-align: center;
  margin: 30px 0;
}

/* ÁLBUMES */
.home-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, 260px);
  gap: 30px;
  padding: 40px;
}

.album-card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
  cursor: pointer;
}

.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

/* GALERÍA */
.gallery-container {
  max-width: 1200px;
  margin: auto;
}

.back-btn {
  margin: 20px;
  padding: 10px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

.photo {
  position: relative;
  break-inside: avoid;
  margin-bottom: 15px;
  cursor: pointer;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  transition: 0.3s;
}

.photo:hover img {
  transform: scale(1.05);
}

/* CHECK */
.checkbox {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 26px;
  height: 26px;
  border: 2px solid white;
  border-radius: 6px;
  background: rgba(0,0,0,0.5);
  z-index: 3;
}

.photo.selected .checkbox {
  background: black;
}

.photo.selected .checkbox::after {
  content: "✔";
  color: white;
  position: absolute;
  top: 2px;
  left: 5px;
}

.photo.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.4);
  border-radius: 12px;
  pointer-events: none;
}

/* BOTÓN CARRITO */
.cart-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: black;
  color: white;
  padding: 18px 30px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
  display: none;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  z-index: 9999;
}

/* TOAST */
.toast {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #d4edda;
  color: #155724;
  padding: 15px 20px;
  border-radius: 10px;
  font-weight: bold;
  display: none;
  z-index: 9999;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
}

/* CHECKOUT */
.checkout {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.checkout-content {
  background: white;
  width: 90%;
  max-width: 500px;
  border-radius: 15px;
  padding: 20px;
}

.checkout-header {
  display: flex;
  justify-content: space-between;
  font-weight: bold;
  margin-bottom: 15px;
}

.checkout-items {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  max-height: 200px;
  overflow-y: auto;
}

.checkout-items img {
  width: 70px;
  border-radius: 8px;
}

.checkout-footer {
  margin-top: 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.checkout-footer input {
  padding: 10px;
}

.checkout-footer button {
  padding: 12px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="toast" class="toast">✔ Fotos agregadas!</div>

<div id="app"></div>

<div id="cartBar" class="cart-bar">
  🛒 <span id="cartText"></span>
</div>

<div class="modal" id="modal">
  <img id="modalImg">
</div>

<!-- CHECKOUT -->
<div id="checkout" class="checkout">
  <div class="checkout-content">
    <div class="checkout-header">
      <span>Tu selección</span>
      <span onclick="cerrarCheckout()" style="cursor:pointer;">✖</span>
    </div>

    <div id="checkoutItems" class="checkout-items"></div>

    <div class="checkout-footer">
      <div id="total"></div>

      <input type="email" id="email" placeholder="Tu email">
      <input type="text" id="telefono" placeholder="Tu teléfono">

      <button onclick="enviarPedido()">Comprar por WhatsApp</button>
      <button onclick="vaciarCarrito()">🗑 Vaciar carrito</button>
    </div>
  </div>
</div>

<script>

let seleccionadas = new Set();
let enCarrito = false;

/* TOAST */
function mostrarToast() {
  const t = document.getElementById("toast");
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 2000);
}

/* BOTÓN */
function actualizarBoton() {
  const btn = document.getElementById("cartBar");
  const txt = document.getElementById("cartText");

  if (seleccionadas.size > 0) {
    btn.style.display = "flex";

    if (!enCarrito) {
      txt.innerText = "Agregar al carrito +" + seleccionadas.size;
    } else {
      txt.innerText = "Finalizar →";
    }
  } else {
    btn.style.display = "none";
    enCarrito = false;
  }
}

/* CLICK BOTÓN */
document.getElementById("cartBar").onclick = function() {
  if (!enCarrito) {
    enCarrito = true;
    mostrarToast();
  } else {
    abrirCheckout();
  }
  actualizarBoton();
};

/* ÁLBUMES */
async function mostrarAlbums() {
  const app = document.getElementById("app");

  const res = await fetch("/api/albums");
  const albums = await res.json();

  app.innerHTML = `<div class="home-container"></div>`;
  const cont = app.firstChild;

  for (const album of albums) {
    const fotos = await (await fetch(`/api/fotos/${album}`)).json();

    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <b>${album.replaceAll("_"," ")}</b>
      <div>${fotos.length} Fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;

    div.onclick = () => abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* ABRIR ÁLBUM */
async function abrirAlbum(nombre) {
  const app = document.getElementById("app");

  const fotos = await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML = `
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");
    img.src = `/images/${nombre}/preview/${foto}`;

    div.onclick = function(e) {
      if (e.target.classList.contains("checkbox")) return;
      abrirModal(`/images/${nombre}/watermarked/${foto}`);
    };

    div.oncontextmenu = function(e) {
      e.preventDefault();
      toggle(div, foto);
    };

    const check = document.createElement("div");
    check.className = "checkbox";

    check.onclick = function(e) {
      e.stopPropagation();
      toggle(div, foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* TOGGLE */
function toggle(div, foto) {
  if (div.classList.contains("selected")) {
    div.classList.remove("selected");
    seleccionadas.delete(foto);
  } else {
    div.classList.add("selected");
    seleccionadas.add(foto);
  }

  actualizarBoton();
}

/* MODAL */
function abrirModal(src) {
  const modal = document.getElementById("modal");
  const img = document.getElementById("modalImg");

  img.src = src;
  modal.style.display = "flex";
  modal.onclick = () => modal.style.display = "none";
}

/* CHECKOUT */
function abrirCheckout() {
  const cont = document.getElementById("checkoutItems");
  cont.innerHTML = "";

  seleccionadas.forEach(foto => {
    const img = document.createElement("img");
    img.src = document.querySelector(`img[src*="${foto}"]`)?.src;
    cont.appendChild(img);
  });

  actualizarTotal();
  document.getElementById("checkout").style.display = "flex";
}

function cerrarCheckout() {
  document.getElementById("checkout").style.display = "none";
}

function actualizarTotal() {
  const precio = 1000;
  const total = seleccionadas.size * precio;
  document.getElementById("total").innerText = "Total: $" + total;
}

function vaciarCarrito() {
  seleccionadas.clear();
  document.querySelectorAll(".photo").forEach(p => p.classList.remove("selected"));
  cerrarCheckout();
  actualizarBoton();
}

function enviarPedido() {
  const email = document.getElementById("email").value;
  const tel = document.getElementById("telefono").value;

  let mensaje = "Hola! Quiero comprar estas fotos:%0A";

  seleccionadas.forEach(f => {
    mensaje += "- " + f + "%0A";
  });

  mensaje += `%0AEmail: ${email}%0ATel: ${tel}`;

  window.open(`https://wa.me/5493810000000?text=${mensaje}`, "_blank");
}

/* BLOQUEAR CLICK DERECHO */
document.addEventListener("contextmenu", e => e.preventDefault());

mostrarAlbums();

</script>

</body>
</html>
