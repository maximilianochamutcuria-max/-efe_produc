<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
  text-align: center;
}

h1 { margin: 20px; }

.container {
  max-width: 1200px;
  margin: auto;
}

/* GALERÍA */
.galeria {
  column-count: 4;
  column-gap: 12px;
  padding: 20px;
}

.foto {
  position: relative;
  margin-bottom: 12px;
  break-inside: avoid;
  transition: 0.25s;
}

.foto:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.foto img {
  width: 100%;
  border-radius: 10px;
}

/* CHECK */
.check {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 2px solid white;
  background: rgba(0,0,0,0.4);
  z-index: 2;
  cursor: pointer;
}

.check::after {
  content: "✔";
  display: none;
  color: white;
  text-align: center;
  line-height: 28px;
}

.foto.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.35);
  border-radius: 10px;
  z-index: 1;
}

.foto.selected .check::after { display: block; }

/* CARRITO BOTÓN */
#carritoBtn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: black;
  color: white;
  padding: 15px 25px;
  border-radius: 30px;
  cursor: pointer;
  font-weight: bold;
}

/* MODAL */
#modalCarrito {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  background: rgba(0,0,0,0.6);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:1000;
}

.modal-content {
  width:90%;
  height:85%;
  background:white;
  border-radius:15px;
  display:flex;
  overflow:hidden;
}

/* IZQUIERDA */
.carrito-izq {
  flex:2;
  padding:20px;
  overflow:auto;
}

.carrito-grid {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}

.item {
  position:relative;
}

.item img {
  width:80px;
  border-radius:6px;
}

.remove {
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  border-radius:50%;
  width:20px;
  height:20px;
  cursor:pointer;
}

/* DERECHA */
.carrito-der {
  flex:1;
  background:#f1f1f1;
  padding:20px;
}

.cerrar-modal {
  position:absolute;
  top:20px;
  right:30px;
  font-size:25px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="contenido" class="container"></div>
<div id="carritoBtn">🛒 0 fotos</div>

<!-- MODAL -->
<div id="modalCarrito">
  <div class="modal-content">
    <span class="cerrar-modal" onclick="cerrarCarrito()">✖</span>

    <div class="carrito-izq">
      <h3>Carrito</h3>
      <div class="carrito-grid" id="listaCarrito"></div>
      <button onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>

    <div class="carrito-der">
      <h3>Resumen</h3>
      <div id="resumen"></div>
    </div>

  </div>
</div>

<script>
const contenido = document.getElementById("contenido");
const carritoBtn = document.getElementById("carritoBtn");

let seleccionadas = [];

const album = {
  preview: "images/gymna_vs_cariocas/preview/"
};

const imagenes = [
"DSC_6014.jpg","DSC_6016.jpg","DSC_6019.jpg","DSC_6022.jpg",
"DSC_6024.jpg","DSC_6030.jpg","DSC_6031.jpg","DSC_6033.jpg"
];

/* BLOQUEAR CLICK DERECHO */
document.addEventListener("contextmenu", e => e.preventDefault());

function abrirAlbum(){
  contenido.innerHTML = `<div class="galeria"></div>`;
  const galeria = document.querySelector(".galeria");

  imagenes.forEach(nombre=>{
    const div = document.createElement("div");
    div.className="foto";

    div.innerHTML=`
      <img src="${album.preview+nombre}">
      <div class="check"></div>
    `;

    div.querySelector(".check").onclick=(e)=>{
      e.stopPropagation();
      toggle(div,nombre);
    };

    div.oncontextmenu=(e)=>{
      e.preventDefault();
      toggle(div,nombre);
    };

    galeria.appendChild(div);
  });
}

function toggle(div,nombre){
  div.classList.toggle("selected");

  if(seleccionadas.includes(nombre)){
    seleccionadas=seleccionadas.filter(f=>f!==nombre);
  }else{
    seleccionadas.push(nombre);
  }

  actualizarCarrito();
}

function actualizarCarrito(){
  carritoBtn.innerText=`🛒 ${seleccionadas.length} fotos`;
}

/* MODAL */
carritoBtn.onclick=()=>{
  abrirCarrito();
};

function abrirCarrito(){
  const modal=document.getElementById("modalCarrito");
  modal.style.display="flex";

  const lista=document.getElementById("listaCarrito");
  lista.innerHTML="";

  seleccionadas.forEach(nombre=>{
    const div=document.createElement("div");
    div.className="item";

    div.innerHTML=`
      <img src="${album.preview+nombre}">
      <div class="remove" onclick="eliminar('${nombre}')">x</div>
    `;

    lista.appendChild(div);
  });

  calcularTotal();
}

function cerrarCarrito(){
  document.getElementById("modalCarrito").style.display="none";
}

function eliminar(nombre){
  seleccionadas=seleccionadas.filter(f=>f!==nombre);
  abrirCarrito();
  actualizarCarrito();
}

function vaciarCarrito(){
  seleccionadas=[];
  abrirCarrito();
  actualizarCarrito();
}

/* 🔥 PACKS */
function calcularTotal(){
  let total=0;
  let cant=seleccionadas.length;

  if(cant>=10) total=12000;
  else if(cant>=7) total=9500;
  else if(cant>=5) total=7500;
  else if(cant>=3) total=5500;
  else if(cant>=1) total=2000*cant;

  document.getElementById("resumen").innerHTML=`
    <p>Fotos: ${cant}</p>
    <h2>Total: $${total}</h2>
  `;
}

abrirAlbum();
</script>

</body>
</html>
