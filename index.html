<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
  justify-content:center;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery-container { max-width:1200px; margin:auto; }

.gallery {
  column-count:4;
  column-gap:15px;
}

.photo {
  position:relative;
  break-inside:avoid;
  margin-bottom:15px;
}

.photo img {
  width:100%;
  border-radius:12px;
  transition:.3s;
  cursor:pointer;
}

.photo:hover img { transform:scale(1.05); }

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  border:2px solid white;
  border-radius:6px;
  background:rgba(0,0,0,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  z-index:2;
}

.photo.selected .checkbox::after {
  content:"✔";
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
  pointer-events:none;
}

/* VOLVER */
.back-btn {
  margin:20px;
  padding:10px;
  background:black;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:18px 30px;
  border-radius:20px;
  display:none;
  cursor:pointer;
  z-index:9999;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.modal img {
  max-width:90vw;
  max-height:90vh;
}

.modal-close {
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:85%;
  background:white;
  border-radius:20px 20px 0 0;
  display:none;
  flex-direction:column;
  z-index:99999;
  overflow:auto;
}

.step { display:none; }
.step.active { display:block; }

.btn {
  width:90%;
  margin:10px auto;
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.btn-black { background:black; color:white; }
.btn-blue { background:#009ee3; color:white; }
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <img id="modalImg">
  <div class="modal-close" onclick="cerrarModal()">✖</div>
</div>

<!-- CHECKOUT -->
<div id="checkout">

  <!-- PASO 1 -->
  <div id="step1" class="step active">
    <div id="resumen" style="padding:15px;"></div>
    <div id="total" style="padding:15px;"></div>

    <button class="btn btn-black" onclick="irAPago()">Siguiente</button>
  </div>

  <!-- PASO 2 -->
  <div id="step2" class="step">
    <button class="btn btn-blue" onclick="pagarMercadoPago()">Mercado Pago</button>
    <button class="btn btn-black">Transferencia</button>
  </div>

  <button class="btn" onclick="cerrarCheckout()">Cerrar</button>

</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = [];
let currentAlbum = "";
let totalGlobal = 0;

/* LINKS */
const LINKS = {
  2000:"PEGAR_LINK_2000",
  5500:"PEGAR_LINK_5500",
  7500:"PEGAR_LINK_7500",
  9500:"PEGAR_LINK_9500",
  12000:"PEGAR_LINK_12000"
};

/* MODAL */
function abrirModal(src){
  modal.style.display="flex";
  modalImg.src = src;
}

function cerrarModal(){
  modal.style.display="none";
}

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block":"none";
  cartBar.innerText = "🛒 "+seleccionadas.length+" fotos";
}

/* CHECKOUT */
cartBar.onclick = abrirCheckout;

function abrirCheckout(){
  checkout.style.display="flex";
  mostrarPaso(1);
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

function mostrarPaso(n){
  document.querySelectorAll(".step").forEach(s=>s.classList.remove("active"));
  document.getElementById("step"+n).classList.add("active");
}

function irAPago(){
  mostrarPaso(2);
}

/* PRECIO */
function calcularPrecio(n){
  let total=0;
  while(n>0){
    if(n>=10){total+=12000;n-=10;}
    else if(n>=7){total+=9500;n-=7;}
    else if(n>=5){total+=7500;n-=5;}
    else if(n>=3){total+=5500;n-=3;}
    else {total+=n*2000;break;}
  }
  return total;
}

/* MP */
function generarLinksPago(total){
  let links=[];
  while(total>0){
    if(total>=12000){links.push(LINKS[12000]);total-=12000;}
    else if(total>=9500){links.push(LINKS[9500]);total-=9500;}
    else if(total>=7500){links.push(LINKS[7500]);total-=7500;}
    else if(total>=5500){links.push(LINKS[5500]);total-=5500;}
    else {links.push(LINKS[2000]);total-=2000;}
  }
  return links;
}

function pagarMercadoPago(){
  generarLinksPago(totalGlobal).forEach(l=>window.open(l));
}

/* RENDER */
function renderCheckout(){
  let agrupado={}, total=0, html="";

  seleccionadas.forEach(i=>{
    if(!agrupado[i.album]) agrupado[i.album]=[];
    agrupado[i.album].push(i.foto);
  });

  for(let a in agrupado){
    let c=agrupado[a].length;
    let p=calcularPrecio(c);
    total+=p;

    html+=`<b>${a}</b><br>${c} fotos → $${p}<br><br>`;
  }

  totalGlobal=total;

  resumen.innerHTML=html;
  total.innerHTML="<b>Total: $"+total+"</b>";
}

/* ÁLBUMES */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML=`<div class="home-container"></div>`;
  const cont=app.firstChild;

  for(const album of albums){
    const fotos=await (await fetch(`/api/fotos/${album}`)).json();

    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=`
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick=()=>abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* GALERÍA */
async function abrirAlbum(nombre){
  currentAlbum=nombre;

  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML=`
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery=document.getElementById("gallery");

  fotos.forEach(foto=>{
    const div=document.createElement("div");
    div.className="photo";

    const img=document.createElement("img");
    img.src=`/images/${nombre}/preview/${foto}`;
    img.onclick=()=>abrirModal(`/images/${nombre}/watermarked/${foto}`);

    const check=document.createElement("div");
    check.className="checkbox";

    check.onclick=(e)=>{
      e.stopPropagation();
      toggle(div,foto);
    };

    div.oncontextmenu=(e)=>{
      e.preventDefault();
      toggle(div,foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* TOGGLE */
function toggle(div,foto){
  const i=seleccionadas.findIndex(f=>f.foto===foto && f.album===currentAlbum);

  if(i!==-1){
    seleccionadas.splice(i,1);
    div.classList.remove("selected");
  } else {
    seleccionadas.push({foto,album:currentAlbum});
    div.classList.add("selected");
  }

  actualizarBoton();
}

mostrarAlbums();

</script>

</body>
</html>
