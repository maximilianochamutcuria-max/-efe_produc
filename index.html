<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery-container { max-width:1200px; margin:auto; }

.gallery {
  column-count:4;
  column-gap:15px;
}

.photo {
  position:relative;
  break-inside:avoid;
  margin-bottom:15px;
}

.photo img {
  width:100%;
  border-radius:12px;
  transition:.3s;
  cursor:pointer;
}

.photo:hover img { transform:scale(1.05); }

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  border:2px solid white;
  border-radius:6px;
  background:rgba(0,0,0,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  z-index:2; /* 🔥 asegura que esté arriba */
}

.photo.selected .checkbox::after {
  content:"✔";
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
  pointer-events:none; /* 🔥 FIX CLAVE */
}

/* VOLVER */
.back-btn {
  margin:20px;
  padding:10px;
  background:black;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:18px 30px;
  border-radius:20px;
  display:none;
  cursor:pointer;
  z-index:9999;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.modal img {
  max-width:90vw;
  max-height:90vh;
  object-fit:contain;
}

.modal-controls {
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  top:50%;
  transform:translateY(-50%);
}

.modal-btn {
  font-size:40px;
  color:white;
  cursor:pointer;
  padding:20px;
}

.modal-close {
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  color:white;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:80%;
  background:white;
  border-radius:20px 20px 0 0;
  box-shadow:0 -5px 20px rgba(0,0,0,0.2);
  display:none;
  flex-direction:column;
  z-index:99999;
  overflow:hidden;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <img id="modalImg">

  <div class="modal-controls">
    <div class="modal-btn" onclick="anteriorFoto()">‹</div>
    <div class="modal-btn" onclick="siguienteFoto()">›</div>
  </div>

  <div class="modal-close" onclick="cerrarModal()">✖</div>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div style="padding:15px; display:flex; justify-content:space-between;">
    <b>Tu selección</b>
    <span style="cursor:pointer;" onclick="cerrarCheckout()">✖</span>
  </div>

  <div id="checkoutItems" style="flex:1; overflow:auto; padding:10px;"></div>

  <div style="padding:15px; border-top:1px solid #ddd;">
    <div id="total"></div>

    <input id="email" placeholder="Email" style="width:100%;margin-top:10px;padding:8px;">
    <input id="telefono" placeholder="Teléfono" style="width:100%;margin-top:10px;padding:8px;">

    <button onclick="enviarWhatsApp()" style="width:100%;margin-top:10px;padding:12px;background:green;color:white;border:none;border-radius:10px;">
      Enviar por WhatsApp
    </button>

    <button onclick="vaciarCarrito()" style="width:100%;margin-top:10px;padding:10px;">
      Vaciar carrito
    </button>
  </div>
</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = new Set();
let currentAlbum = "";

/* MODAL */
let fotosActuales = [];
let fotoIndex = 0;

function abrirModal(lista,index){
  fotosActuales = lista;
  fotoIndex = index;
  modal.style.display="flex";
  modalImg.src = fotosActuales[index];
}

function cerrarModal(){ modal.style.display="none"; }

function siguienteFoto(){
  fotoIndex=(fotoIndex+1)%fotosActuales.length;
  modalImg.src=fotosActuales[fotoIndex];
}

function anteriorFoto(){
  fotoIndex=(fotoIndex-1+fotosActuales.length)%fotosActuales.length;
  modalImg.src=fotosActuales[fotoIndex];
}

/* BOTÓN */
function actualizarBoton(){
  if(seleccionadas.size>0){
    cartBar.style.display="block";
    cartBar.innerText="🛒 "+seleccionadas.size+" fotos";
  } else {
    cartBar.style.display="none";
  }
}

/* CHECKOUT */
const checkout = document.getElementById("checkout");
const checkoutItems = document.getElementById("checkoutItems");
const totalDiv = document.getElementById("total");

cartBar.onclick = ()=> abrirCheckout();

function abrirCheckout(){
  checkout.style.display="flex";
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

function renderCheckout(){
  checkoutItems.innerHTML="";

  seleccionadas.forEach(foto=>{
    const div=document.createElement("div");
    div.style.display="flex";
    div.style.marginBottom="10px";

    div.innerHTML=`
      <img src="/images/${currentAlbum}/preview/${foto}" style="width:60px;height:60px;object-fit:cover;margin-right:10px;border-radius:8px;">
      <span style="flex:1;">${foto}</span>
      <span style="cursor:pointer;color:red;">✖</span>
    `;

    div.querySelector("span:last-child").onclick=()=>{
      eliminarFoto(foto);
    };

    checkoutItems.appendChild(div);
  });

  totalDiv.innerText="Total: $" + (seleccionadas.size * 2000);
}

function eliminarFoto(foto){
  seleccionadas.delete(foto);
  actualizarBoton();
  renderCheckout();
}

function vaciarCarrito(){
  seleccionadas.clear();
  actualizarBoton();
  renderCheckout();
}

/* WHATSAPP */
function enviarWhatsApp(){
  const tel=document.getElementById("telefono").value;
  const email=document.getElementById("email").value;

  let mensaje="Pedido:%0A";

  seleccionadas.forEach(f=>{
    mensaje+="- "+f+"%0A";
  });

  mensaje+=`%0AEmail: ${email}%0ATeléfono: ${tel}`;

  window.open(`https://wa.me/549XXXXXXXXXX?text=${mensaje}`);
}

/* ÁLBUMES */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML=`<div class="home-container"></div>`;
  const cont=app.firstChild;

  for(const album of albums){
    const fotos=await (await fetch(`/api/fotos/${album}`)).json();

    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=`
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick=()=>abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* GALERÍA */
async function abrirAlbum(nombre){
  currentAlbum = nombre;

  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();
  const watermarked=fotos.map(f=>`/images/${nombre}/watermarked/${f}`);

  app.innerHTML=`
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery=document.getElementById("gallery");

  fotos.forEach((foto,i)=>{
    const div=document.createElement("div");
    div.className="photo";

    const img=document.createElement("img");
    img.src=`/images/${nombre}/preview/${foto}`;
    img.onclick=()=>abrirModal(watermarked,i);

    const check=document.createElement("div");
    check.className="checkbox";

    check.onclick=(e)=>{
      e.stopPropagation();
      toggle(div,foto);
    };

    div.oncontextmenu=(e)=>{
      e.preventDefault();
      toggle(div,foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* TOGGLE */
function toggle(div,foto){
  if(seleccionadas.has(foto)){
    seleccionadas.delete(foto);
    div.classList.remove("selected");
  } else {
    seleccionadas.add(foto);
    div.classList.add("selected");
  }
  actualizarBoton();
}

mostrarAlbums();

</script>

</body>
</html>
