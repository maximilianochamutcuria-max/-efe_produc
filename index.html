<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery-container { max-width:1200px; margin:auto; }

.gallery {
  column-count:4;
  column-gap:15px;
}

.photo {
  position:relative;
  break-inside:avoid;
  margin-bottom:15px;
}

.photo img {
  width:100%;
  border-radius:12px;
  transition:.3s;
  cursor:pointer;
}

.photo:hover img { transform:scale(1.05); }

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  border:2px solid white;
  border-radius:6px;
  background:rgba(0,0,0,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
}

.photo.selected .checkbox::after {
  content:"✔";
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
}

/* VOLVER */
.back-btn {
  margin:20px;
  padding:10px;
  background:black;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:18px 30px;
  border-radius:20px;
  display:none;
  cursor:pointer;
  z-index:9999;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.modal img {
  max-width:90vw;
  max-height:90vh;
  object-fit:contain;
}

.modal-controls {
  position:absolute;
  width:100%;
  display:flex;
  justify-content:space-between;
  top:50%;
  transform:translateY(-50%);
}

.modal-btn {
  font-size:40px;
  color:white;
  cursor:pointer;
  padding:20px;
}

.modal-close {
  position:absolute;
  top:20px;
  right:20px;
  font-size:30px;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <img id="modalImg">

  <div class="modal-controls">
    <div class="modal-btn" onclick="anteriorFoto()">‹</div>
    <div class="modal-btn" onclick="siguienteFoto()">›</div>
  </div>

  <div class="modal-close" onclick="cerrarModal()">✖</div>
</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = new Set();

/* ===== MODAL ===== */
let fotosActuales = [];
let fotoIndex = 0;

function abrirModal(lista,index){
  fotosActuales = lista;
  fotoIndex = index;
  modal.style.display="flex";
  modalImg.src = fotosActuales[index];
}

function cerrarModal(){ modal.style.display="none"; }

function siguienteFoto(){
  fotoIndex=(fotoIndex+1)%fotosActuales.length;
  modalImg.src=fotosActuales[fotoIndex];
}

function anteriorFoto(){
  fotoIndex=(fotoIndex-1+fotosActuales.length)%fotosActuales.length;
  modalImg.src=fotosActuales[fotoIndex];
}

/* ===== BOTÓN ===== */
function actualizarBoton(){
  if(seleccionadas.size>0){
    cartBar.style.display="block";
    cartBar.innerText="🛒 "+seleccionadas.size+" fotos";
  } else {
    cartBar.style.display="none";
  }
}

/* 🔥 CLICK CARRITO */
cartBar.onclick = ()=>{
  alert("Acá después conectamos el checkout 💰");
};

/* ===== ÁLBUMES ===== */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML=`<div class="home-container"></div>`;
  const cont=app.firstChild;

  for(const album of albums){
    const fotos=await (await fetch(`/api/fotos/${album}`)).json();

    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=`
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick=()=>abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* ===== GALERÍA ===== */
async function abrirAlbum(nombre){
  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();
  const watermarked=fotos.map(f=>`/images/${nombre}/watermarked/${f}`);

  app.innerHTML=`
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery=document.getElementById("gallery");

  fotos.forEach((foto,i)=>{
    const div=document.createElement("div");
    div.className="photo";

    const img=document.createElement("img");
    img.src=`/images/${nombre}/preview/${foto}`;

    /* SOLO IMAGEN ABRE MODAL */
    img.onclick=()=>abrirModal(watermarked,i);

    /* CHECK */
    const check=document.createElement("div");
    check.className="checkbox";

    check.onclick=(e)=>{
      e.stopPropagation();
      toggle(div,foto);
    };

    /* CLICK DERECHO */
    div.oncontextmenu=(e)=>{
      e.preventDefault();
      toggle(div,foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* ===== TOGGLE FIX ===== */
function toggle(div,foto){

  if(seleccionadas.has(foto)){
    seleccionadas.delete(foto);
    div.classList.remove("selected");
  } else {
    seleccionadas.add(foto);
    div.classList.add("selected");
  }

  actualizarBoton();
}

mostrarAlbums();

</script>

</body>
</html>
