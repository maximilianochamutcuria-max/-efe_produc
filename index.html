<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

h1 {
  text-align: center;
  margin: 30px 0;
}

/* ÁLBUMES */
.home-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, 260px);
  gap: 30px;
  padding: 40px;
}

.album-card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
  cursor: pointer;
}

.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

/* GALERÍA */
.gallery-container {
  max-width: 1200px;
  margin: auto;
}

.back-btn {
  margin: 20px;
  padding: 10px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

.photo {
  position: relative;
  break-inside: avoid;
  margin-bottom: 15px;
  cursor: pointer;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  transition: 0.3s;
}

.photo:hover img {
  transform: scale(1.05);
}

/* CHECK */
.checkbox {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 26px;
  height: 26px;
  border: 2px solid white;
  border-radius: 6px;
  background: rgba(0,0,0,0.5);
  z-index: 3;
}

.photo.selected .checkbox {
  background: black;
}

.photo.selected .checkbox::after {
  content: "✔";
  color: white;
  position: absolute;
  top: 2px;
  left: 5px;
}

.photo.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.4);
  border-radius: 12px;
}

/* BOTÓN */
.cart-bar {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: black;
  color: white;
  padding: 18px 30px;
  border-radius: 20px;
  font-size: 18px;
  display: none;
  cursor: pointer;
  z-index: 9999;
}

/* TOAST */
.toast {
  position: fixed;
  top: 20px;
  left: 20px;
  background: #d4edda;
  padding: 15px;
  border-radius: 10px;
  display: none;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
}

/* CHECKOUT PRO */
.checkout {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: none;
  z-index: 10000;
}

.checkout-panel {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 90%;
  background: #f7f7f7;
  border-radius: 20px 20px 0 0;
  display: flex;
}

.checkout-left {
  width: 60%;
  padding: 30px;
  overflow-y: auto;
}

.checkout-items {
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
}

.checkout-items img {
  width: 120px;
  border-radius: 10px;
}

.checkout-right {
  width: 40%;
  background: #eee;
  padding: 30px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.buy-btn {
  padding: 15px;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.close-bar {
  position: absolute;
  bottom: 0;
  width: 100%;
  text-align: center;
  padding: 15px;
  background: white;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="toast" class="toast">✔ Fotos agregadas</div>
<div id="app"></div>

<div id="cartBar" class="cart-bar"></div>

<div class="modal" id="modal">
  <img id="modalImg">
</div>

<!-- CHECKOUT -->
<div id="checkout" class="checkout">
  <div class="checkout-panel">

    <div class="checkout-left">
      <h2>Carrito</h2>
      <div id="checkoutItems" class="checkout-items"></div>
      <div onclick="vaciarCarrito()" style="color:red;margin-top:20px;">🗑 Limpiar carrito</div>
    </div>

    <div class="checkout-right">
      <div id="detallePedido"></div>
      <div id="total"></div>

      <input id="email" placeholder="Email">
      <input id="telefono" placeholder="Teléfono">

      <button class="buy-btn" onclick="enviarPedido()">Finalizar compra</button>
    </div>

  </div>

  <div class="close-bar" onclick="cerrarCheckout()">Cerrar</div>
</div>

<script>

let seleccionadas = new Set();
let enCarrito = false;

/* BOTÓN */
function actualizarBoton() {
  const btn = document.getElementById("cartBar");

  if (seleccionadas.size > 0) {
    btn.style.display = "block";
    btn.innerText = enCarrito
      ? "Finalizar →"
      : "🛒 Agregar (" + seleccionadas.size + ")";
  } else {
    btn.style.display = "none";
    enCarrito = false;
  }
}

document.getElementById("cartBar").onclick = () => {
  if (!enCarrito) {
    enCarrito = true;
    document.getElementById("toast").style.display = "block";
    setTimeout(()=>document.getElementById("toast").style.display="none",2000);
  } else {
    abrirCheckout();
  }
  actualizarBoton();
};

/* ÁLBUMES */
async function mostrarAlbums() {
  const res = await fetch("/api/albums");
  const albums = await res.json();

  app.innerHTML = `<div class="home-container"></div>`;
  const cont = app.firstChild;

  for (const album of albums) {
    const fotos = await (await fetch(`/api/fotos/${album}`)).json();

    const div = document.createElement("div");
    div.className = "album-card";
    div.innerHTML = `
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick = () => abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* GALERÍA */
async function abrirAlbum(nombre) {
  const fotos = await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML = `
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");
    img.src = `/images/${nombre}/preview/${foto}`;

    div.onclick = () => abrirModal(`/images/${nombre}/watermarked/${foto}`);
    div.oncontextmenu = e => { e.preventDefault(); toggle(div,foto); };

    const check = document.createElement("div");
    check.className = "checkbox";
    check.onclick = e => { e.stopPropagation(); toggle(div,foto); };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* TOGGLE */
function toggle(div, foto) {
  div.classList.toggle("selected");
  seleccionadas.has(foto) ? seleccionadas.delete(foto) : seleccionadas.add(foto);
  actualizarBoton();
}

/* MODAL */
function abrirModal(src) {
  modal.style.display = "flex";
  modalImg.src = src;
  modal.onclick = () => modal.style.display = "none";
}

/* CHECKOUT */
function abrirCheckout() {
  const cont = document.getElementById("checkoutItems");
  const detalle = document.getElementById("detallePedido");

  cont.innerHTML = "";

  seleccionadas.forEach(f => {
    const img = document.createElement("img");
    img.src = document.querySelector(`img[src*="${f}"]`)?.src;
    cont.appendChild(img);
  });

  const precio = 2000;
  const total = seleccionadas.size * precio;

  detalle.innerHTML = `${seleccionadas.size} fotos x $${precio}`;
  document.getElementById("total").innerText = "Total: $" + total;

  checkout.style.display = "block";
}

function cerrarCheckout() {
  checkout.style.display = "none";
}

function vaciarCarrito() {
  seleccionadas.clear();
  document.querySelectorAll(".photo").forEach(p=>p.classList.remove("selected"));
  cerrarCheckout();
  actualizarBoton();
}

function enviarPedido() {
  let msg = "Pedido:%0A";
  seleccionadas.forEach(f => msg += "- " + f + "%0A");

  window.open(`https://wa.me/5493810000000?text=${msg}`);
}

mostrarAlbums();

</script>

</body>
</html>
