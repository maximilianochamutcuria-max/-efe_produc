<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; font-family:Arial; background:#f5f5f5; }

h1 { text-align:center; }

/* ALBUMES */
.albums {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.album {
  background:white;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
}

.album img {
  width:100%;
  height:200px;
  object-fit:cover;
}

/* GALERIA */
.gallery {
  column-count:4;
  column-gap:15px;
  padding:20px;
}

.photo {
  margin-bottom:15px;
  break-inside:avoid;
  position:relative;
}

.photo img {
  width:100%;
  border-radius:10px;
  cursor:pointer;
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:10px;
}

/* VISOR */
#viewer {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.9);
  display:none;
  justify-content:center;
  align-items:center;
}

#viewer img {
  max-width:80%;
}

.close {
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* CART */
.cart {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:10px 20px;
  border-radius:20px;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0;
  width:100%;
  height:70%;
  background:white;
  display:none;
  padding:20px;
}

button {
  width:100%;
  padding:10px;
  margin-top:10px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="albums" class="albums"></div>
<div id="gallery" class="gallery" style="display:none;"></div>
<div id="cart" class="cart"></div>

<!-- VISOR -->
<div id="viewer">
  <div class="close" onclick="viewer.style.display='none'">✖</div>
  <img id="viewerImg">
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <h3 id="total"></h3>
  <input id="email" placeholder="Email">
  <button onclick="pagar()">Continuar</button>
</div>

<script>
let fotos = [];
let seleccion = [];
let albumActual = "";

/* PRECIO */
function precio(n){
  let t=0;
  if(n>=10){ t+=12000; n-=10; }
  if(n>=3){ t+=5500; n-=3; }
  t+=n*2000;
  return t;
}

/* ALBUMES */
async function cargarAlbums(){
  const res = await fetch("/api/albums");
  const data = await res.json();

  data.forEach(a=>{
    const div=document.createElement("div");
    div.className="album";
    div.innerHTML=`<img src="/images/${a}/preview/${a}_1.jpg"><h3>${a}</h3>`;
    div.onclick=()=>abrirAlbum(a);
    albums.appendChild(div);
  });
}

/* ABRIR */
async function abrirAlbum(a){
  albumActual=a;
  albums.style.display="none";
  gallery.style.display="block";

  const res = await fetch(`/api/fotos/${a}`);
  fotos = await res.json();

  gallery.innerHTML="";

  fotos.forEach((f,i)=>{
    const d=document.createElement("div");
    d.className="photo";

    d.innerHTML=`<img src="/images/${a}/preview/${f}">`;

    d.onclick=()=>{
      if(seleccion.includes(f)){
        seleccion = seleccion.filter(x=>x!==f);
        d.classList.remove("selected");
      } else {
        seleccion.push(f);
        d.classList.add("selected");
      }
      actualizar();
    };

    d.querySelector("img").onclick=(e)=>{
      e.stopPropagation();
      viewer.style.display="flex";
      viewerImg.src=`/images/${a}/preview/${f}`;
    };

    gallery.appendChild(d);
  });
}

/* CART */
function actualizar(){
  cart.style.display = seleccion.length?"block":"none";
  cart.innerText = seleccion.length+" fotos";
}

cart.onclick=()=>{
  checkout.style.display="block";
  total.innerText="Total: $"+precio(seleccion.length);
};

/* PAGO */
function pagar(){
  const total = precio(seleccion.length);

  fetch("/crear-pago",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ total })
  })
  .then(r=>r.json())
  .then(d=>{
    if(d.init_point){
      window.location.href=d.init_point;
    } else {
      alert("Error en pago");
    }
  });
}

cargarAlbums();
</script>

</body>
</html>
