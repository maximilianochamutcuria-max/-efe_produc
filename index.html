<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
  justify-content:center;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery-container { max-width:1200px; margin:auto; }

.gallery {
  column-count:4;
  column-gap:15px;
}

.photo {
  position:relative;
  break-inside:avoid;
  margin-bottom:15px;
}

.photo img {
  width:100%;
  border-radius:12px;
  cursor:pointer;
  transition:.3s;
}

.photo:hover img { transform:scale(1.05); }

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  border:2px solid white;
  border-radius:6px;
  background:rgba(0,0,0,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  z-index:2;
}

.photo.selected .checkbox::after { content:"✔"; }

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
  pointer-events:none;
}

/* BOTONES */
.back-btn {
  margin:20px;
  padding:10px;
  background:black;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:15px 25px;
  border-radius:20px;
  display:none;
  cursor:pointer;
  z-index:9999;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.modal img {
  max-width:90vw;
  max-height:90vh;
}

.modal-close {
  position:absolute;
  top:20px;
  right:20px;
  color:white;
  font-size:30px;
  cursor:pointer;
}

/* CHECKOUT */
#checkout {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:85%;
  background:white;
  border-radius:20px 20px 0 0;
  display:none;
  z-index:99999;
}

.checkout-body {
  display:flex;
  height:100%;
}

/* IZQUIERDA */
.checkout-left {
  flex:2;
  padding:20px;
  overflow:auto;
}

.grid-fotos {
  display:grid;
  grid-template-columns:repeat(auto-fill,100px);
  gap:10px;
}

.grid-fotos img {
  width:100%;
  border-radius:10px;
}

/* DERECHA */
.checkout-right {
  flex:1;
  background:#f7f7f7;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:12px;
}

.btn {
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  width:100%;
}

.btn-blue { background:#009ee3; color:white; }
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <img id="modalImg">
  <div class="modal-close" onclick="cerrarModal()">✖</div>
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div class="checkout-body">

    <div class="checkout-left">
      <div id="gridFotos" class="grid-fotos"></div>
      <div style="margin-top:15px;color:red;cursor:pointer;" onclick="vaciarCarrito()">
        🗑 Limpiar carrito
      </div>
    </div>

    <div class="checkout-right">

      <div class="card">
        <b>Info</b>
        <div id="infoUpsell"></div>
      </div>

      <div class="card">
        <b>Pedido</b>
        <div id="detallePedido"></div>
        <div id="total"></div>
      </div>

      <div class="card">
        <input placeholder="Email">
        <input placeholder="Teléfono">
      </div>

      <button class="btn btn-blue" onclick="pagarMercadoPago()">
        Mercado Pago
      </button>

      <button class="btn" onclick="cerrarCheckout()">Cerrar</button>

    </div>

  </div>
</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = [];
let currentAlbum = "";
let totalGlobal = 0;

/* 🔥 SOLO ESTE LINK ACTIVO */
const LINKS = {
  2000:"https://mpago.la/17zfiHq",
  5500:"",
  7500:"",
  9500:"",
  12000:""
};

/* MODAL */
function abrirModal(src){
  modal.style.display="flex";
  modalImg.src=src;
}

function cerrarModal(){
  modal.style.display="none";
}

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block":"none";
  cartBar.innerText = "🛒 "+seleccionadas.length+" fotos";
}

/* CHECKOUT */
cartBar.onclick = abrirCheckout;

function abrirCheckout(){
  checkout.style.display="block";
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

/* PRECIO */
function calcularPrecio(n){
  let total=0;
  while(n>0){
    if(n>=10){total+=12000;n-=10;}
    else if(n>=7){total+=9500;n-=7;}
    else if(n>=5){total+=7500;n-=5;}
    else if(n>=3){total+=5500;n-=3;}
    else {total+=n*2000;break;}
  }
  return total;
}

/* LINKS */
function generarLinksPago(total){
  let links=[];
  while(total>0){
    if(total>=12000){links.push(LINKS[12000]);total-=12000;}
    else if(total>=9500){links.push(LINKS[9500]);total-=9500;}
    else if(total>=7500){links.push(LINKS[7500]);total-=7500;}
    else if(total>=5500){links.push(LINKS[5500]);total-=5500;}
    else {links.push(LINKS[2000]);total-=2000;}
  }
  return links;
}

/* PAGAR */
function pagarMercadoPago(){

  const links = generarLinksPago(totalGlobal);

  if(links.length === 0){
    alert("No hay nada para pagar");
    return;
  }

  window.open(links[0], "_blank");
}

/* RENDER */
function renderCheckout(){

  const grid=document.getElementById("gridFotos");
  const detalle=document.getElementById("detallePedido");
  const totalDiv=document.getElementById("total");
  const info=document.getElementById("infoUpsell");

  grid.innerHTML="";
  detalle.innerHTML="";
  info.innerHTML="";

  let agrupado={}, total=0;

  seleccionadas.forEach(i=>{
    if(!agrupado[i.album]) agrupado[i.album]=[];
    agrupado[i.album].push(i.foto);
  });

  for(let album in agrupado){

    agrupado[album].forEach(f=>{
      const img=document.createElement("img");
      img.src=`/images/${album}/preview/${f}`;
      grid.appendChild(img);
    });

    let c=agrupado[album].length;
    let p=calcularPrecio(c);
    total+=p;

    detalle.innerHTML+=`<b>${album}</b><br>${c} fotos → $${p}<br><br>`;

    if(c<3){
      info.innerHTML=`Agregá ${3-c} fotos y pagás pack de 3`;
    }
  }

  totalGlobal=total;
  totalDiv.innerHTML="<b>Total: $"+total+"</b>";
}

/* VACIAR */
function vaciarCarrito(){
  seleccionadas=[];
  actualizarBoton();
  renderCheckout();
}

/* ÁLBUMES */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML=`<div class="home-container"></div>`;
  const cont=app.firstChild;

  for(const album of albums){
    const fotos=await (await fetch(`/api/fotos/${album}`)).json();

    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=`
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick=()=>abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* GALERÍA */
async function abrirAlbum(nombre){
  currentAlbum=nombre;

  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML=`
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery=document.getElementById("gallery");

  fotos.forEach(foto=>{
    const div=document.createElement("div");
    div.className="photo";

    const img=document.createElement("img");
    img.src=`/images/${nombre}/preview/${foto}`;
    img.onclick=()=>abrirModal(`/images/${nombre}/watermarked/${foto}`);

    const check=document.createElement("div");
    check.className="checkbox";

    check.onclick=(e)=>{
      e.stopPropagation();
      toggle(div,foto);
    };

    div.oncontextmenu=(e)=>{
      e.preventDefault();
      toggle(div,foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

/* TOGGLE */
function toggle(div,foto){
  const i=seleccionadas.findIndex(f=>f.foto===foto && f.album===currentAlbum);

  if(i!==-1){
    seleccionadas.splice(i,1);
    div.classList.remove("selected");
  } else {
    seleccionadas.push({foto,album:currentAlbum});
    div.classList.add("selected");
  }

  actualizarBoton();
}

mostrarAlbums();

</script>

</body>
</html>
