<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
/* (TODO TU CSS ORIGINAL SIN CAMBIOS) */
body { font-family: Arial; background:#f5f5f5; margin:0; text-align:center; }
h1 { margin:20px; }
.container { max-width:1200px; margin:auto; }
.album { width:300px; margin:auto; cursor:pointer; }
.album img { width:100%; border-radius:10px; }

.galeria { column-count:4; column-gap:12px; padding:20px; }
.foto { position:relative; margin-bottom:12px; break-inside:avoid; transition:.25s; }
.foto:hover { transform:translateY(-6px) scale(1.02); box-shadow:0 10px 25px rgba(0,0,0,0.25); }
.foto img { width:100%; border-radius:10px; cursor:pointer; }

.check { position:absolute; bottom:10px; left:10px; width:28px; height:28px; border-radius:6px; border:2px solid white; background:rgba(0,0,0,0.4); cursor:pointer; z-index:2; }
.check::after { content:"✔"; display:none; color:white; text-align:center; line-height:28px; }

.foto.selected::after { content:""; position:absolute; inset:0; background:rgba(255,0,0,0.35); border-radius:10px; z-index:1; }
.foto.selected .check::after { display:block; }

.volver { margin:20px; padding:10px 20px; background:black; color:white; border-radius:10px; cursor:pointer; }

#carrito { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:black; color:white; padding:12px 25px; border-radius:25px; cursor:pointer; }

#modalCarrito { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); display:none; justify-content:center; align-items:center; z-index:1000; }

.modal { width:90%; height:85%; background:white; border-radius:15px; display:flex; overflow:hidden; position:relative; }

.izq { flex:2; padding:20px; overflow:auto; }
.grid { display:flex; flex-wrap:wrap; gap:10px; }

.item { position:relative; }
.item img { width:80px; border-radius:6px; }

.remove { position:absolute; top:-5px; right:-5px; background:red; color:white; border-radius:50%; width:20px; height:20px; cursor:pointer; }

.der { flex:1; background:#f1f1f1; padding:20px; text-align:left; }

.input { width:100%; padding:10px; margin-top:10px; border-radius:8px; border:1px solid #ccc; }

.btn-pagar { margin-top:15px; width:100%; padding:12px; background:black; color:white; border:none; border-radius:10px; cursor:pointer; }

.cerrar-modal { position:absolute; top:10px; right:20px; font-size:25px; cursor:pointer; }

#visor { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; justify-content:center; align-items:center; z-index:999; }

#visor img { max-width:90%; max-height:90%; }

.cerrar { position:absolute; top:20px; right:30px; color:white; font-size:30px; cursor:pointer; }

.flecha { position:absolute; top:50%; transform:translateY(-50%); font-size:40px; color:white; cursor:pointer; }
.izquierda { left:30px; }
.derecha { right:30px; }
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="contenido" class="container"></div>
<div id="carrito" style="display:none;">0 fotos | $0</div>

<div id="modalCarrito">
  <div class="modal">
    <span class="cerrar-modal" onclick="cerrarCarrito()">✖</span>

    <div class="izq">
      <h3>Carrito</h3>
      <div class="grid" id="listaCarrito"></div>
      <button onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>

    <div class="der">
      <h3>Resumen</h3>
      <div id="resumen"></div>

      <h4>Email</h4>
      <input id="email" class="input" placeholder="Tu email">

      <h4>Teléfono</h4>
      <input id="telefono" class="input" placeholder="Tu teléfono">

      <button class="btn-pagar" onclick="pagar()">Pagar con MercadoPago</button>
    </div>
  </div>
</div>

<script>
const contenido = document.getElementById("contenido");
const carrito = document.getElementById("carrito");

let seleccionadas = [];
let imagenActual = 0;

const album = {
  nombre: "gymna_vs_cariocas",
  preview: "images/gymna_vs_cariocas/preview/",
  watermarked: "images/gymna_vs_cariocas/watermarked/",
  portada: "DSC_6014.jpg"
};

const imagenes = [/* mismas imágenes */];

document.addEventListener("contextmenu", e => e.preventDefault());

function mostrarAlbum() {
  carrito.style.display = "none";
  contenido.innerHTML = `
    <div class="album" onclick="abrirAlbum()">
      <img src="${album.preview + album.portada}">
      <h3>${album.nombre}</h3>
    </div>
  `;
}

function abrirAlbum() {
  seleccionadas = [];
  actualizarCarrito();

  contenido.innerHTML = `
    <button class="volver" onclick="mostrarAlbum()">⬅ Volver</button>
    <div class="galeria"></div>
  `;

  carrito.style.display = "block";
  const galeria = document.querySelector(".galeria");

  imagenes.forEach(nombre => {
    const div = document.createElement("div");
    div.className = "foto";

    div.innerHTML = `
      <img src="${album.preview + nombre}" onclick="verImagen('${nombre}')">
      <div class="check"></div>
    `;

    div.querySelector(".check").onclick = (e) => {
      e.stopPropagation();
      toggleSeleccion(div, nombre);
    };

    div.oncontextmenu = (e) => {
      e.preventDefault();
      toggleSeleccion(div, nombre);
    };

    galeria.appendChild(div);
  });
}

function toggleSeleccion(div, nombre) {
  div.classList.toggle("selected");

  if (seleccionadas.includes(nombre)) {
    seleccionadas = seleccionadas.filter(f => f !== nombre);
  } else {
    seleccionadas.push(nombre);
  }

  actualizarCarrito();
}

function calcularTotal() {
  let c = seleccionadas.length;
  if (c >= 10) return 12000;
  if (c >= 7) return 9500;
  if (c >= 5) return 7500;
  if (c >= 3) return 5500;
  return c * 2000;
}

function actualizarCarrito() {
  carrito.innerText = `${seleccionadas.length} fotos | $${calcularTotal()}`;
}

carrito.onclick = () => abrirCarrito();

function abrirCarrito() {
  document.getElementById("modalCarrito").style.display = "flex";

  const lista = document.getElementById("listaCarrito");
  lista.innerHTML = "";

  seleccionadas.forEach(nombre => {
    lista.innerHTML += `
      <div class="item">
        <img src="${album.preview + nombre}">
        <div class="remove" onclick="eliminar('${nombre}')">x</div>
      </div>
    `;
  });

  document.getElementById("resumen").innerHTML = `
    <p>${seleccionadas.length} fotos</p>
    <h2>$${calcularTotal()}</h2>
  `;
}

function cerrarCarrito() {
  document.getElementById("modalCarrito").style.display = "none";
}

function eliminar(nombre) {
  seleccionadas = seleccionadas.filter(f => f !== nombre);
  abrirCarrito();
  actualizarCarrito();
}

function vaciarCarrito() {
  seleccionadas = [];
  abrirCarrito();
  actualizarCarrito();
}

/* 🔥 PAGO CORREGIDO */
async function pagar() {
  const email = document.getElementById("email").value;
  const telefono = document.getElementById("telefono").value;

  if (!email) {
    alert("Ingresá tu email");
    return;
  }

  try {
    const res = await fetch("/crear-preferencia", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fotos: seleccionadas,
        total: calcularTotal(),
        email,
        telefono
      })
    });

    const data = await res.json();
    console.log("MP:", data);

    if (!data.init_point) {
      alert("Error al crear el pago");
      return;
    }

    window.location.href = data.init_point;

  } catch (e) {
    alert("Error conectando con servidor");
    console.error(e);
  }
}

mostrarAlbum();
</script>

</body>
</html>
