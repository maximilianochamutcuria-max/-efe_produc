<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
  text-align: center;
}

h1 {
  margin: 20px;
}

.albums {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  padding: 20px;
}

.album {
  background: white;
  border-radius: 15px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
}

.album:hover {
  transform: scale(1.03);
}

.album img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.album-info {
  padding: 10px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="contenido"></div>

<script>
const contenido = document.getElementById("contenido");

// 🔥 CONFIG MANUAL (por ahora)
const albums = [
  {
    nombre: "gymna_vs_cariocas",
    path: "images/gymna_vs_cariocas/preview/",
    portada: "DSC_6014.jpg",
    total: 32
  }
];

// 🟢 MOSTRAR ÁLBUMES
function mostrarAlbums() {
  contenido.innerHTML = '<div class="albums"></div>';
  const cont = document.querySelector(".albums");

  albums.forEach(album => {
    const div = document.createElement("div");
    div.className = "album";

    div.innerHTML = `
      <img src="${album.path + album.portada}">
      <div class="album-info">
        <h3>${album.nombre}</h3>
        <p>${album.total} fotos</p>
      </div>
    `;

    div.onclick = () => abrirAlbum(album);

    cont.appendChild(div);
  });
}

// 🟢 ABRIR ÁLBUM
function abrirAlbum(album) {
  const imagenes = [
    "DSC_6014.jpg","DSC_6016.jpg","DSC_6019.jpg","DSC_6022.jpg",
    "DSC_6024.jpg","DSC_6030.jpg","DSC_6031.jpg","DSC_6033.jpg",
    "DSC_6034.jpg","DSC_6035.jpg","DSC_6036.jpg","DSC_6040.jpg",
    "DSC_6041.jpg","DSC_6043.jpg","DSC_6044.jpg","DSC_6045.jpg",
    "DSC_6049.jpg","DSC_6050.jpg","DSC_6051.jpg","DSC_6052.jpg",
    "DSC_6055.jpg","DSC_6056.jpg","DSC_6057.jpg","DSC_6059.jpg",
    "DSC_6060.jpg","DSC_6062.jpg","DSC_6063.jpg","DSC_6064.jpg",
    "DSC_6065.jpg","DSC_6067.jpg","DSC_6072.jpg","DSC_6076.jpg"
  ];

  contenido.innerHTML = `
    <button onclick="volver()">⬅ Volver</button>
    <div class="galeria"></div>
  `;

  const galeria = document.querySelector(".galeria");

  galeria.style.display = "grid";
  galeria.style.gridTemplateColumns = "repeat(auto-fill, minmax(250px, 1fr))";
  galeria.style.gap = "10px";
  galeria.style.padding = "20px";

  imagenes.forEach(nombre => {
    const img = document.createElement("img");
    img.src = album.path + nombre;
    img.style.width = "100%";
    img.style.borderRadius = "10px";

    galeria.appendChild(img);
  });
}

// 🔙 VOLVER
function volver() {
  mostrarAlbums();
}

// INIT
mostrarAlbums();
</script>

</body>
</html>
