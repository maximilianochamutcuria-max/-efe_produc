<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery-container { max-width:1200px; margin:auto; }

.gallery {
  column-count:4;
  column-gap:15px;
}

.photo {
  position:relative;
  break-inside:avoid;
  margin-bottom:15px;
}

.photo img {
  width:100%;
  border-radius:12px;
  transition:.3s;
  cursor:pointer;
}

.photo:hover img { transform:scale(1.05); }

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  border:2px solid white;
  border-radius:6px;
  background:rgba(0,0,0,0.5);
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  cursor:pointer;
  z-index:2;
}

.photo.selected .checkbox::after {
  content:"✔";
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
  pointer-events:none;
}

/* VOLVER */
.back-btn {
  margin:20px;
  padding:10px;
  background:black;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

/* CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:18px 30px;
  border-radius:20px;
  display:none;
  cursor:pointer;
  z-index:9999;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  justify-content:center;
  align-items:center;
  z-index:99999;
}

.modal img {
  max-width:90vw;
  max-height:90vh;
}

/* CHECKOUT FULLFOTO STYLE */
#checkout {
  position:fixed;
  inset:0;
  background:white;
  display:none;
  z-index:99999;
  flex-direction:column;
}

.checkout-header {
  padding:15px 20px;
  font-weight:bold;
  border-bottom:1px solid #ddd;
  display:flex;
  justify-content:space-between;
}

.checkout-body {
  display:flex;
  height:100%;
}

/* IZQUIERDA */
.checkout-left {
  flex:2;
  padding:20px;
  overflow:auto;
}

.checkout-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,120px);
  gap:15px;
}

.checkout-item {
  text-align:center;
}

.checkout-item img {
  width:100%;
  border-radius:10px;
}

.remove-btn {
  color:red;
  cursor:pointer;
  font-size:14px;
}

/* DERECHA */
.checkout-right {
  flex:1;
  background:#f7f7f7;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:12px;
}

.total {
  font-weight:bold;
  margin-top:10px;
}

input {
  width:100%;
  padding:10px;
  margin-top:5px;
}

button {
  padding:12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

.btn-whatsapp {
  background:green;
  color:white;
}

.btn-clear {
  background:#eee;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <img id="modalImg">
</div>

<!-- CHECKOUT -->
<div id="checkout">
  <div class="checkout-header">
    Carrito
    <span style="cursor:pointer;" onclick="cerrarCheckout()">✖</span>
  </div>

  <div class="checkout-body">

    <!-- IZQUIERDA -->
    <div class="checkout-left">
      <div id="checkoutGrid" class="checkout-grid"></div>
      <div style="margin-top:20px;color:red;cursor:pointer;" onclick="vaciarCarrito()">
        🗑 Limpiar carrito
      </div>
    </div>

    <!-- DERECHA -->
    <div class="checkout-right">

      <div class="card">
        <b>Info</b>
        <div style="font-size:14px;margin-top:5px;">
          Agregá más fotos para obtener descuento 🔥
        </div>
      </div>

      <div class="card">
        <b>Pedido</b>
        <div id="resumen"></div>
        <div class="total" id="total"></div>
      </div>

      <div class="card">
        <label>Email</label>
        <input id="email">

        <label>Teléfono</label>
        <input id="telefono">
      </div>

      <button class="btn-whatsapp" onclick="enviarWhatsApp()">
        Enviar por WhatsApp
      </button>

    </div>

  </div>
</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = new Set();
let currentAlbum = "";

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.size ? "block" : "none";
  cartBar.innerText = "🛒 " + seleccionadas.size + " fotos";
}

/* CHECKOUT */
const checkout = document.getElementById("checkout");

cartBar.onclick = ()=> abrirCheckout();

function abrirCheckout(){
  checkout.style.display="flex";
  renderCheckout();
}

function cerrarCheckout(){
  checkout.style.display="none";
}

function renderCheckout(){

  const grid = document.getElementById("checkoutGrid");
  const resumen = document.getElementById("resumen");
  const totalDiv = document.getElementById("total");

  grid.innerHTML="";
  resumen.innerHTML="";

  seleccionadas.forEach(foto=>{
    const div=document.createElement("div");
    div.className="checkout-item";

    div.innerHTML=`
      <img src="/images/${currentAlbum}/preview/${foto}">
      <div class="remove-btn">✖</div>
    `;

    div.querySelector(".remove-btn").onclick=()=>{
      seleccionadas.delete(foto);
      renderCheckout();
      actualizarBoton();
    };

    grid.appendChild(div);
  });

  resumen.innerHTML = `${seleccionadas.size} fotos seleccionadas`;
  totalDiv.innerText = "Total: $" + (seleccionadas.size * 2000);
}

function vaciarCarrito(){
  seleccionadas.clear();
  renderCheckout();
  actualizarBoton();
}

/* WHATSAPP */
function enviarWhatsApp(){
  let mensaje="Pedido:%0A";
  seleccionadas.forEach(f=> mensaje+= "- "+f+"%0A");
  window.open(`https://wa.me/549XXXXXXXXXX?text=${mensaje}`);
}

/* ÁLBUMES */
async function mostrarAlbums(){
  const res=await fetch("/api/albums");
  const albums=await res.json();

  app.innerHTML=`<div class="home-container"></div>`;
  const cont=app.firstChild;

  for(const album of albums){
    const fotos=await (await fetch(`/api/fotos/${album}`)).json();

    const div=document.createElement("div");
    div.className="album-card";
    div.innerHTML=`
      <b>${album}</b>
      <div>${fotos.length} fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;
    div.onclick=()=>abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* GALERÍA */
async function abrirAlbum(nombre){
  currentAlbum = nombre;

  const fotos=await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML=`
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery=document.getElementById("gallery");

  fotos.forEach(foto=>{
    const div=document.createElement("div");
    div.className="photo";

    const img=document.createElement("img");
    img.src=`/images/${nombre}/preview/${foto}`;

    const check=document.createElement("div");
    check.className="checkbox";

    check.onclick=(e)=>{
      e.stopPropagation();
      toggle(div,foto);
    };

    div.oncontextmenu=(e)=>{
      e.preventDefault();
      toggle(div,foto);
    };

    div.appendChild(img);
    div.appendChild(check);
    gallery.appendChild(div);
  });
}

function toggle(div,foto){
  if(seleccionadas.has(foto)){
    seleccionadas.delete(foto);
    div.classList.remove("selected");
  } else {
    seleccionadas.add(foto);
    div.classList.add("selected");
  }
  actualizarBoton();
}

mostrarAlbums();

</script>

</body>
</html>
