<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* ÁLBUMES */
.home-container {
  display:grid;
  grid-template-columns:repeat(auto-fill,260px);
  gap:30px;
  padding:40px;
  justify-content:center;
}

.album-card {
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 5px 12px rgba(0,0,0,0.1);
  cursor:pointer;
}

.album-card img {
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:8px;
}

/* GALERÍA */
.gallery { column-count:4; column-gap:15px; }
.photo { break-inside:avoid; margin-bottom:15px; position:relative; }

.photo img {
  width:100%;
  border-radius:12px;
  cursor:pointer;
}

/* CHECK */
.checkbox {
  position:absolute;
  bottom:10px;
  left:10px;
  width:26px;
  height:26px;
  background:rgba(0,0,0,0.5);
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.photo.selected::after {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,0,0,0.4);
  border-radius:12px;
}

/* BOTÓN CARRITO */
.cart-bar {
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:black;
  color:white;
  padding:15px 25px;
  border-radius:20px;
  display:none;
  cursor:pointer;
}

/* CHECKOUT */
#checkout, #pagoScreen {
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:85%;
  background:white;
  border-radius:20px 20px 0 0;
  display:none;
  z-index:99999;
}

/* PAGO SCREEN */
.pago-box {
  text-align:center;
  margin-top:100px;
}

.btn {
  padding:15px;
  border:none;
  border-radius:10px;
  margin:10px;
  cursor:pointer;
  width:250px;
}

.btn-black { background:black; color:white; }
.btn-green { background:#00a650; color:white; }

</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- CHECKOUT -->
<div id="checkout">
  <div style="padding:20px">

    <h2>Pedido</h2>
    <div id="detallePedido"></div>
    <div id="total"></div>

    <button class="btn btn-black" onclick="irAPago()">Continuar</button>
    <button class="btn" onclick="cerrarCheckout()">Cerrar</button>

  </div>
</div>

<!-- PANTALLA DE PAGO -->
<div id="pagoScreen">
  <div class="pago-box">

    <img src="https://http2.mlstatic.com/frontend-assets/mp-web-navigation/ui-navigation/5.21.9/mercadopago/logo__large.png" width="150">

    <p>Vamos a redirigirte a MercadoPago</p>

    <div id="botonesPago"></div>

    <button class="btn" onclick="cerrarPago()">Cerrar</button>

  </div>
</div>

<script>

const app = document.getElementById("app");
const cartBar = document.getElementById("cartBar");

let seleccionadas = [];
let totalGlobal = 0;

const LINKS = {
  2000:"https://mpago.la/17zfiHq",
  12000:"https://mpago.la/1fNeWh5"
};

/* PRECIO */
function calcularPrecio(n){
  let total=0;
  while(n>0){
    if(n>=10){total+=12000;n-=10;}
    else {total+=n*2000;break;}
  }
  return total;
}

function generarPagos(total){
  let parts=[];
  while(total>0){
    if(total>=12000){parts.push(12000); total-=12000;}
    else {parts.push(2000); total-=2000;}
  }
  return parts;
}

/* CHECKOUT */
cartBar.onclick = ()=>{
  checkout.style.display="block";
  renderCheckout();
};

function cerrarCheckout(){
  checkout.style.display="none";
}

/* IR A PAGO */
function irAPago(){
  checkout.style.display="none";
  pagoScreen.style.display="block";
  renderPagos();
}

function cerrarPago(){
  pagoScreen.style.display="none";
}

/* RENDER CHECKOUT */
function renderCheckout(){
  let total=calcularPrecio(seleccionadas.length);
  totalGlobal=total;

  detallePedido.innerHTML = `${seleccionadas.length} fotos`;
  total.innerHTML = `<b>Total: $${total}</b>`;
}

/* RENDER PAGOS */
function renderPagos(){
  const cont = document.getElementById("botonesPago");
  cont.innerHTML="";

  const pagos = generarPagos(totalGlobal);

  pagos.forEach(monto=>{
    const btn=document.createElement("button");
    btn.className="btn btn-green";
    btn.innerText="Pagar $"+monto;
    btn.onclick=()=>window.location.href=LINKS[monto];
    cont.appendChild(btn);
  });
}

/* DEMO SIMPLE */
function mostrarAlbums(){
  app.innerHTML="<h2 style='text-align:center'>Demo</h2>";

  for(let i=0;i<12;i++){
    const btn=document.createElement("button");
    btn.innerText="Seleccionar foto "+(i+1);
    btn.onclick=()=>{
      seleccionadas.push(i);
      actualizarBoton();
    };
    app.appendChild(btn);
  }
}

function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block":"none";
  cartBar.innerText = "🛒 "+seleccionadas.length+" fotos";
}

mostrarAlbums();

</script>

</body>
</html>
