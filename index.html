<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
/* TU CSS ORIGINAL intacto + SOLO agrego abajo */

.der {
  flex:1;
  background:#f1f1f1;
  padding:20px;
  text-align:left;
}

/* FORM */
.input {
  width:100%;
  padding:10px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
}

.btn-pagar {
  margin-top:15px;
  width:100%;
  padding:12px;
  background:black;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="contenido" class="container"></div>
<div id="carrito" style="display:none;">0 fotos | $0</div>

<div id="modalCarrito">
  <div class="modal">
    <span class="cerrar-modal" onclick="cerrarCarrito()">✖</span>

    <div class="izq">
      <h3>Carrito</h3>
      <div class="grid" id="listaCarrito"></div>
      <button onclick="vaciarCarrito()">Vaciar carrito</button>
    </div>

    <div class="der">
      <h3>Resumen</h3>
      <div id="resumen"></div>

      <h4>Email</h4>
      <input id="email" class="input" placeholder="Tu email">

      <h4>Teléfono</h4>
      <input id="telefono" class="input" placeholder="Tu teléfono">

      <button class="btn-pagar" onclick="pagar()">Pagar con MercadoPago</button>
    </div>
  </div>
</div>

<script>

/* 🔥 NUEVO: RESUMEN DETALLADO */
function generarResumen() {
  let cant = seleccionadas.length;
  let total = calcularTotal();

  let pack = "";
  if (cant >= 10) pack = "Pack 10 fotos ($12000)";
  else if (cant >= 7) pack = "Pack 7 fotos ($9500)";
  else if (cant >= 5) pack = "Pack 5 fotos ($7500)";
  else if (cant >= 3) pack = "Pack 3 fotos ($5500)";
  else pack = `Precio individual ($2000 c/u)`;

  return `
    <p><strong>Cantidad:</strong> ${cant}</p>
    <p><strong>Pack aplicado:</strong> ${pack}</p>
    <hr>
    <h2>Total: $${total}</h2>
  `;
}

/* 🔥 MODIFICO SOLO ESTA FUNCIÓN */
function abrirCarrito() {
  document.getElementById("modalCarrito").style.display = "flex";

  const lista = document.getElementById("listaCarrito");
  lista.innerHTML = "";

  seleccionadas.forEach(nombre => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <img src="${album.preview + nombre}">
      <div class="remove" onclick="eliminar('${nombre}')">x</div>
    `;

    lista.appendChild(div);
  });

  document.getElementById("resumen").innerHTML = generarResumen();
}

/* 🔥 MERCADOPAGO */
async function pagar() {
  const email = document.getElementById("email").value;
  const telefono = document.getElementById("telefono").value;

  if (!email) {
    alert("Ingresá tu email");
    return;
  }

  try {
    const res = await fetch("/crear-preferencia", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        fotos: seleccionadas,
        total: calcularTotal(),
        email,
        telefono
      })
    });

    const data = await res.json();
    window.location.href = data.init_point;

  } catch (err) {
    alert("Error al iniciar pago");
  }
}

</script>

</body>
</html>
