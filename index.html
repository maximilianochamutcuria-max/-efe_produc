<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

/* HEADER */
h1 {
  text-align: center;
  margin: 30px 0;
}

/* ===== GRID DE ÁLBUMES ===== */
.home-container {
  display: grid;
  grid-template-columns: repeat(4, 260px); /* 👈 tamaño */
  gap: 30px;
  padding-left: 40px; /* izquierda */
}

/* CARD */
.album-card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}

.album-card:hover {
  transform: scale(1.03);
}

.album-title {
  font-size: 15px;
  font-weight: bold;
}

.album-count {
  color: gray;
  margin: 5px 0 10px;
  font-size: 14px;
}

/* PREVIEW */
.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

/* ===== GALERÍA ===== */
.gallery-container {
  max-width: 1200px;
  margin: auto;
}

.back-btn {
  display: inline-block;
  margin: 20px 0;
  padding: 10px 15px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

@media (max-width: 1000px) {
  .gallery { column-count: 3; }
}
@media (max-width: 600px) {
  .gallery { column-count: 2; }
}

.photo {
  break-inside: avoid;
  margin-bottom: 15px;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  transition: transform 0.3s;
  cursor: pointer;
}

.photo img:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>

<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

// 📂 ÁLBUMES
const albums = [
  {
    nombre: "gymna_vs_cariocas",
    titulo: "FUTSAL TUCUMAN Fecha 3: Malvinas Argentinas vs Alianza"
  },
  {
    nombre: "balcor_vs_lomas",
    titulo: "FUTSAL TUCUMAN Fecha 3: Balcor vs Lomas"
  },
  {
    nombre: "vinotinto_vs_sportivo",
    titulo: "FUTSAL TUCUMAN Fecha 4: Vinotinto vs Sportivo"
  },
  {
    nombre: "templo_vs_leones",
    titulo: "FUTSAL TUCUMAN Fecha 4: Templo Negro vs Los Leones"
  }
];

// 🏠 HOME GRID
function mostrarAlbums() {
  const app = document.getElementById("app");

  app.innerHTML = `<div class="home-container" id="albums"></div>`;

  const cont = document.getElementById("albums");

  albums.forEach(album => {

    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <div class="album-title">${album.titulo}</div>
      <div class="album-count">Cargando...</div>
      <img src="/images/${album.nombre}/preview/1.jpg">
    `;

    fetch(`/api/fotos/${album.nombre}`)
      .then(r => r.json())
      .then(fotos => {
        div.querySelector(".album-count").innerText = fotos.length + " Fotos";
      });

    div.onclick = () => abrirAlbum(album.nombre);

    cont.appendChild(div);
  });
}

// 📸 ABRIR ÁLBUM
async function abrirAlbum(nombre) {
  const app = document.getElementById("app");

  const res = await fetch(`/api/fotos/${nombre}`);
  const fotos = await res.json();

  app.innerHTML = `
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");

    img.src = `/images/${nombre}/preview/${foto}`;
    img.onclick = () => abrirModal(`/images/${nombre}/watermarked/${foto}`);

    div.appendChild(img);
    gallery.appendChild(div);
  });
}

// MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// INIT
mostrarAlbums();

</script>

</body>
</html>
