<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
  text-align: center;
}

h1 {
  margin: 30px 0;
}

/* ÁLBUMES */
.albums {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 30px;
  padding: 40px;
}

.album {
  background: white;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  cursor: pointer;
  overflow: hidden;
  text-align: left;
}

.album img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.album-info {
  padding: 15px;
}

.album-info h3 {
  margin: 0;
  font-size: 18px;
}

.album-info p {
  margin: 5px 0 0;
  color: gray;
}

/* GALERÍA */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  padding: 20px;
}

.card img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

/* VOLVER */
.back {
  margin: 20px;
  cursor: pointer;
  font-weight: bold;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 80%;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<!-- ÁLBUMES -->
<div id="albums" class="albums"></div>

<!-- GALERÍA -->
<div id="gallery" style="display:none;">
  <div class="back" onclick="volver()">← Volver</div>
  <div class="grid" id="grid"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

const base = "images";

// 🔥 SOLO CONFIGURÁS ESTO (sin fotos)
const albumsData = [
  {
    nombre: "FUTSAL TUCUMAN Fecha 3: Gymna vs Cariocas",
    carpeta: "gymna_vs_cariocas",
    preview: "DSC_2189-Enhanced-NR.jpg"
  }
];

// CARGAR ÁLBUMES
function cargarAlbums() {
  const container = document.getElementById("albums");

  albumsData.forEach(album => {
    const div = document.createElement("div");
    div.className = "album";

    div.innerHTML = `
      <img src="${base}/${album.carpeta}/preview/${album.preview}">
      <div class="album-info">
        <h3>${album.nombre}</h3>
        <p>Ver fotos</p>
      </div>
    `;

    div.onclick = () => abrirAlbum(album);

    container.appendChild(div);
  });
}

// 🚀 AUTOMÁTICO (LEE DESDE SERVER)
async function abrirAlbum(album) {
  document.getElementById("albums").style.display = "none";
  document.getElementById("gallery").style.display = "block";

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  try {
    const res = await fetch(`/api/fotos/${album.carpeta}`);
    const fotos = await res.json();

    fotos.forEach(file => {
      const div = document.createElement("div");
      div.className = "card";

      const img = document.createElement("img");
      img.src = `${base}/${album.carpeta}/preview/${file}`;
      img.onclick = () => abrirModal(img.src);

      div.appendChild(img);
      grid.appendChild(div);
    });

  } catch (error) {
    console.error("Error cargando fotos:", error);
  }
}

// VOLVER
function volver() {
  document.getElementById("albums").style.display = "grid";
  document.getElementById("gallery").style.display = "none";
}

// MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// INICIAR
cargarAlbums();

</script>

</body>
</html>
