<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>@efe_produc</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 10px;
      padding: 20px;
    }

    .foto {
      position: relative;
      cursor: pointer;
    }

    .foto img {
      width: 100%;
      border-radius: 10px;
    }

    .check {
      position: absolute;
      top: 10px;
      right: 10px;
      background: white;
      border-radius: 50%;
      padding: 5px;
      display: none;
    }

    .foto.selected .check {
      display: block;
    }

    #carrito {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: black;
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
    }
  </style>
</head>

<body>

<h1>@efe_produc</h1>

<div class="galeria" id="galeria"></div>

<div id="carrito">Total: $0</div>

<script>
  const galeria = document.getElementById("galeria");
  let total = 0;

  // 🔥 RUTA REAL DE TU CARPETA
  const basePath = "images/gymna_vs_cariocas/preview/";

  // 👇 LISTA REAL DE TUS FOTOS
  const imagenes = [
    "DSC_6014.jpg",
    "DSC_6016.jpg",
    "DSC_6019.jpg",
    "DSC_6022.jpg",
    "DSC_6024.jpg",
    "DSC_6030.jpg",
    "DSC_6031.jpg",
    "DSC_6033.jpg",
    "DSC_6034.jpg",
    "DSC_6035.jpg",
    "DSC_6036.jpg",
    "DSC_6040.jpg",
    "DSC_6041.jpg",
    "DSC_6043.jpg",
    "DSC_6044.jpg",
    "DSC_6045.jpg",
    "DSC_6049.jpg",
    "DSC_6050.jpg",
    "DSC_6051.jpg",
    "DSC_6052.jpg",
    "DSC_6055.jpg",
    "DSC_6056.jpg",
    "DSC_6057.jpg",
    "DSC_6059.jpg",
    "DSC_6060.jpg",
    "DSC_6062.jpg",
    "DSC_6063.jpg",
    "DSC_6064.jpg",
    "DSC_6065.jpg",
    "DSC_6067.jpg",
    "DSC_6072.jpg",
    "DSC_6076.jpg"
  ];

  imagenes.forEach(nombre => {
    const div = document.createElement("div");
    div.classList.add("foto");

    const src = basePath + nombre;

    div.innerHTML = `
      <img src="${src}">
      <div class="check">✔</div>
    `;

    div.onclick = () => {
      div.classList.toggle("selected");

      if (div.classList.contains("selected")) {
        total += 1000;
      } else {
        total -= 1000;
      }

      document.getElementById("carrito").innerText = "Total: $" + total;
    };

    galeria.appendChild(div);
  });
</script>

</body>
</html>
