<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 20px;
}

/* BOTONES ÁLBUMES */
#albums {
  margin-bottom: 20px;
}

#albums button {
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
  border-radius: 8px;
  border: none;
  background: white;
  color: black;
  font-weight: bold;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 15px;
  padding: 20px;
}

/* CARD */
.card {
  overflow: hidden;
  border-radius: 12px;
}

.card img {
  width: 100%;
  display: block;
  cursor: pointer;
  transition: transform 0.3s;
}

.card img:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

/* IMAGEN GRANDE */
.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="albums"></div>
<div class="grid" id="gallery"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

// 🔒 BLOQUEO CLICK DERECHO (básico)
document.addEventListener("contextmenu", e => e.preventDefault());

// 📂 LISTA DE ÁLBUMES
const albums = ["gymna_vs_cariocas"];

// 🔘 CREAR BOTONES DE ÁLBUMES
function cargarAlbums() {
  const cont = document.getElementById("albums");

  albums.forEach(album => {
    const btn = document.createElement("button");
    btn.innerText = album;
    btn.onclick = () => cargarFotos(album);
    cont.appendChild(btn);
  });
}

// 📸 CARGAR FOTOS (SIN MARCA)
async function cargarFotos(album) {
  const res = await fetch(`/api/fotos/${album}`);
  const fotos = await res.json();

  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "card";

    const img = document.createElement("img");

    // 🔥 MINIATURA SIN MARCA
    img.src = `/images/${album}/preview/${foto}`;

    // 🔥 FOTO GRANDE CON WATERMARK
    img.onclick = () => abrirModal(`/images/${album}/watermarked/${foto}`);

    div.appendChild(img);
    gallery.appendChild(div);
  });
}

// 🖼️ ABRIR MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

// ❌ CERRAR MODAL
function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// 🚀 INICIAR
cargarAlbums();

</script>

</body>
</html>
