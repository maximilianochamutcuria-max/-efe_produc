<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin: 20px;
}

button {
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
  border: none;
  border-radius: 8px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
  padding: 20px;
}

.card img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
}

.modal img {
  max-width: 90%;
  max-height: 80%;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="albums"></div>

<div class="grid" id="gallery"></div>

<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

const base = "images";

// 🔥 LISTA DE ÁLBUMES (agregás más acá)
const albums = [
  "gymna_vs_cariocas"
];

// CARGAR ÁLBUMES
function cargarAlbumes() {
  const albumsDiv = document.getElementById("albums");

  albums.forEach(album => {
    const btn = document.createElement("button");
    btn.innerText = album;
    btn.onclick = () => cargarFotos(album);
    albumsDiv.appendChild(btn);
  });
}

// CARGAR FOTOS DESDE preview
async function cargarFotos(album) {
  try {
    const res = await fetch(`${base}/${album}/preview`);
    const text = await res.text();

    const parser = new DOMParser();
    const html = parser.parseFromString(text, "text/html");
    const links = html.querySelectorAll("a");

    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    links.forEach(link => {
      const file = link.getAttribute("href");

      if(file && (file.endsWith(".jpg") || file.endsWith(".png"))) {

        const div = document.createElement("div");
        div.className = "card";

        const img = document.createElement("img");
        img.src = `${base}/${album}/preview/${file}`;

        img.onclick = () => abrirModal(img.src);

        div.appendChild(img);
        gallery.appendChild(div);
      }
    });

  } catch (error) {
    console.error("Error cargando fotos:", error);
  }
}

// MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// INICIAR
cargarAlbumes();

</script>

</body>
</html>
