<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
  text-align: center;
}

h1 {
  margin: 20px;
}

.container {
  max-width: 1200px;
  margin: auto;
}

/* ÁLBUM */
.album {
  width: 300px;
  margin: auto;
  cursor: pointer;
}

.album img {
  width: 100%;
  border-radius: 10px;
}

/* GALERÍA */
.galeria {
  column-count: 4;
  column-gap: 12px;
  padding: 20px;
}

.foto {
  position: relative;
  margin-bottom: 12px;
  break-inside: avoid;
}

.foto img {
  width: 100%;
  border-radius: 10px;
  cursor: pointer;
}

/* CHECK */
.check {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 2px solid white;
  background: rgba(0,0,0,0.4);
  cursor: pointer;
}

.check::after {
  content: "✔";
  color: white;
  font-size: 16px;
  display: none;
}

.foto.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.35);
  border-radius: 10px;
}

.foto.selected .check::after {
  display: block;
}

/* BOTÓN */
.volver {
  margin: 20px;
  padding: 10px 20px;
  background: black;
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* CARRITO */
#carrito {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: black;
  color: white;
  padding: 12px 25px;
  border-radius: 25px;
}

/* VISOR */
#visor {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.9);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 999;
}

#visor img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
}

.cerrar {
  position: absolute;
  top: 20px;
  right: 30px;
  color: white;
  font-size: 30px;
  cursor: pointer;
}

.flecha {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 40px;
  color: white;
  cursor: pointer;
}

.izquierda { left: 30px; }
.derecha { right: 30px; }
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="contenido" class="container"></div>
<div id="carrito" style="display:none;">0 fotos | $0</div>

<script>
const contenido = document.getElementById("contenido");
const carrito = document.getElementById("carrito");

let seleccionadas = [];
let imagenActual = 0;

const album = {
  nombre: "gymna_vs_cariocas",
  preview: "images/gymna_vs_cariocas/preview/",
  watermarked: "images/gymna_vs_cariocas/watermarked/",
  portada: "DSC_6014.jpg"
};

const imagenes = [
  "DSC_6014.jpg","DSC_6016.jpg","DSC_6019.jpg","DSC_6022.jpg",
  "DSC_6024.jpg","DSC_6030.jpg","DSC_6031.jpg","DSC_6033.jpg",
  "DSC_6034.jpg","DSC_6035.jpg","DSC_6036.jpg","DSC_6040.jpg",
  "DSC_6041.jpg","DSC_6043.jpg","DSC_6044.jpg","DSC_6045.jpg",
  "DSC_6049.jpg","DSC_6050.jpg","DSC_6051.jpg","DSC_6052.jpg",
  "DSC_6055.jpg","DSC_6056.jpg","DSC_6057.jpg","DSC_6059.jpg",
  "DSC_6060.jpg","DSC_6062.jpg","DSC_6063.jpg","DSC_6064.jpg",
  "DSC_6065.jpg","DSC_6067.jpg","DSC_6072.jpg","DSC_6076.jpg"
];

function mostrarAlbum() {
  carrito.style.display = "none";

  contenido.innerHTML = `
    <div class="album" onclick="abrirAlbum()">
      <img src="${album.preview + album.portada}">
      <h3>${album.nombre}</h3>
    </div>
  `;
}

function abrirAlbum() {
  seleccionadas = [];
  actualizarCarrito();

  contenido.innerHTML = `
    <button class="volver" onclick="mostrarAlbum()">⬅ Volver</button>
    <div class="galeria"></div>
  `;

  carrito.style.display = "block";

  const galeria = document.querySelector(".galeria");

  imagenes.forEach((nombre, index) => {
    const div = document.createElement("div");
    div.className = "foto";

    div.innerHTML = `
      <img src="${album.preview + nombre}" onclick="verImagen('${nombre}')">
      <div class="check"></div>
    `;

    div.querySelector(".check").onclick = (e) => {
      e.stopPropagation();
      toggleSeleccion(div, nombre);
    };

    galeria.appendChild(div);
  });
}

function toggleSeleccion(div, nombre) {
  div.classList.toggle("selected");

  if (seleccionadas.includes(nombre)) {
    seleccionadas = seleccionadas.filter(f => f !== nombre);
  } else {
    seleccionadas.push(nombre);
  }

  actualizarCarrito();
}

function actualizarCarrito() {
  const precio = 1000;
  carrito.innerText = `${seleccionadas.length} fotos | $${seleccionadas.length * precio}`;
}

function verImagen(nombre) {
  imagenActual = imagenes.indexOf(nombre);

  const visor = document.createElement("div");
  visor.id = "visor";

  visor.innerHTML = `
    <span class="cerrar" onclick="cerrarVisor()">✖</span>
    <span class="flecha izquierda" onclick="cambiarImagen(-1)">❮</span>
    <img id="imgGrande">
    <span class="flecha derecha" onclick="cambiarImagen(1)">❯</span>
  `;

  document.body.appendChild(visor);
  actualizarImagen();
}

function actualizarImagen() {
  const img = document.getElementById("imgGrande");
  img.src = album.watermarked + imagenes[imagenActual];
}

function cambiarImagen(direccion) {
  imagenActual += direccion;

  if (imagenActual < 0) imagenActual = imagenes.length - 1;
  if (imagenActual >= imagenes.length) imagenActual = 0;

  actualizarImagen();
}

function cerrarVisor() {
  document.getElementById("visor").remove();
}

mostrarAlbum();
</script>

</body>
</html>
