<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>efe_produc</title>
<style>
body{background:#0f0f0f;color:white;font-family:Arial;text-align:center;}
.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px;margin-top:20px;}
.card{background:#1a1a1a;padding:15px;border-radius:10px;cursor:pointer;}
.gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:20px;}
img{width:200px;border-radius:10px;cursor:pointer;}
.selected{border:4px solid lime;}
.hidden{display:none;}
button{margin-top:15px;padding:10px 20px;cursor:pointer;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);justify-content:center;align-items:center;}
canvas{max-width:90vw;max-height:90vh;border-radius:10px;}
</style>
</head>
<body>

<h1>@efe_produc</h1>
<p>Seleccioná la carpeta (ej: Fecha 5)</p>

<input type="file" id="input" webkitdirectory multiple>

<div id="home">
<h2>Partidos</h2>
<div class="grid" id="partidos"></div>
</div>

<div id="galeria" class="hidden">
<button onclick="volver()">⬅ Volver</button>
<div class="gallery" id="fotos"></div>
<h2 id="total">Total: $0</h2>
<button onclick="comprar()">Comprar</button>
</div>

<div class="modal" id="modal">
<canvas id="canvas"></canvas>
</div>

<script>
let estructura = {};
let seleccionadas = [];
let actual = "";

document.getElementById("input").addEventListener("change", function(e){
 estructura = {};
 let files = Array.from(e.target.files).filter(f=>f.type.startsWith("image/"));

 files.forEach(file=>{
  let partes = file.webkitRelativePath.split("/");
  let partido = partes[1];

  if(!estructura[partido]) estructura[partido]=[];
  estructura[partido].push(file);
 });

 mostrarPartidos();
});

function mostrarPartidos(){
 let cont=document.getElementById("partidos");
 cont.innerHTML="";
 Object.keys(estructura).forEach(p=>{
  let div=document.createElement("div");
  div.className="card";
  div.innerText=p;
  div.onclick=()=>abrir(p);
  cont.appendChild(div);
 });
}

function abrir(nombre){
 actual = nombre;
 seleccionadas = [];
 updateTotal();

 document.getElementById("home").classList.add("hidden");
 document.getElementById("galeria").classList.remove("hidden");

 let cont=document.getElementById("fotos");
 cont.innerHTML="";

 estructura[nombre].forEach((file,i)=>{
  let img=document.createElement("img");
  img.src=URL.createObjectURL(file);

  img.onclick=()=>toggleSelect(i,img);
  img.ondblclick=()=>ver(file);

  cont.appendChild(img);
 });
}

function volver(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("galeria").classList.add("hidden");
}

function toggleSelect(i,img){
 if(seleccionadas.includes(i)){
  seleccionadas=seleccionadas.filter(x=>x!==i);
  img.classList.remove("selected");
 }else{
  seleccionadas.push(i);
  img.classList.add("selected");
 }
 updateTotal();
}

function calcularPrecio(n){
 if(n>=10) return 12000;
 if(n>=7) return 9500;
 if(n>=5) return 7500;
 if(n>=3) return 5500;
 return n*2000;
}

function updateTotal(){
 document.getElementById("total").innerText="Total: $"+calcularPrecio(seleccionadas.length);
}

function comprar(){
 let total=calcularPrecio(seleccionadas.length);
 if(seleccionadas.length==0){alert("Seleccioná fotos");return;}
 alert("Total: $"+total+"\n(Aquí conectamos MercadoPago)");
}

function ver(file){
 let img=new Image();
 img.onload=function(){
  let canvas=document.getElementById("canvas");
  let ctx=canvas.getContext("2d");

  canvas.width=img.width;
  canvas.height=img.height;

  ctx.drawImage(img,0,0);

  ctx.font="bold 70px Arial";
  ctx.fillStyle="rgba(255,255,255,0.5)";
  ctx.rotate(-0.4);

  for(let x=-canvas.width;x<canvas.width*2;x+=300){
    for(let y=-canvas.height;y<canvas.height*2;y+=200){
      ctx.fillText("@efe_produc",x,y);
    }
  }

  ctx.setTransform(1,0,0,1,0,0);

  document.getElementById("modal").style.display="flex";
 }
 img.src=URL.createObjectURL(file);
}

document.getElementById("modal").onclick=function(){
 this.style.display="none";
}
</script>

</body>
</html>
