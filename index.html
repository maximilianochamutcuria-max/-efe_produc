<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body { margin:0; background:#f5f5f5; font-family:Arial; }
h1 { text-align:center; margin:30px 0; }

/* (todo tu CSS igual, no lo toco salvo esto nuevo) */

.resumen-box {
  background:#f7f7f7;
  padding:10px;
  margin-top:10px;
  border-radius:10px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div id="app"></div>
<div id="cartBar" class="cart-bar"></div>

<!-- CHECKOUT -->
<div id="checkout">

  <div class="checkout-header">
    <b>Tu selección</b>
    <span onclick="cerrarCheckout()">✖</span>
  </div>

  <div id="checkoutItems" class="checkout-items"></div>

  <div class="checkout-summary">
    <div id="resumen"></div>
    <div id="total"></div>
  </div>

</div>

<script>

let seleccionadas = []; // 🔥 CAMBIO IMPORTANTE
let currentAlbum = "";

/* TOGGLE */
function toggle(div,foto){

  const index = seleccionadas.findIndex(f=> f.foto===foto && f.album===currentAlbum);

  if(index !== -1){
    seleccionadas.splice(index,1);
    div.classList.remove("selected");
  } else {
    seleccionadas.push({foto, album: currentAlbum});
    div.classList.add("selected");
  }

  actualizarBoton();
}

/* BOTÓN */
function actualizarBoton(){
  cartBar.style.display = seleccionadas.length ? "block" : "none";
  cartBar.innerText = "🛒 " + seleccionadas.length + " fotos";
}

/* CHECKOUT */
function renderCheckout(){

  const resumen = document.getElementById("resumen");
  const totalDiv = document.getElementById("total");

  let agrupado = {};

  seleccionadas.forEach(item=>{
    if(!agrupado[item.album]) agrupado[item.album]=[];
    agrupado[item.album].push(item.foto);
  });

  let html="";
  let total=0;

  for(let album in agrupado){

    let cantidad = agrupado[album].length;
    let precio = calcularPrecio(cantidad);

    total += precio;

    html += `
      <div class="resumen-box">
        <b>${album}</b><br>
        ${cantidad} fotos → $${precio}
      </div>
    `;
  }

  resumen.innerHTML = html;
  totalDiv.innerHTML = "<b>Total: $" + total + "</b>";
}

/* 💰 PACKS */
function calcularPrecio(n){

  if(n>=10) return Math.floor(n/10)*12000 + calcularPrecio(n%10);
  if(n>=7) return 9500 + calcularPrecio(n-7);
  if(n>=5) return 7500 + calcularPrecio(n-5);
  if(n>=3) return 5500 + calcularPrecio(n-3);

  return n * 2000;
}

</script>

</body>
</html>
