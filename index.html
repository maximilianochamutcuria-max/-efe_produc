<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

h1 {
  text-align: center;
  margin: 30px 0;
}

/* ÁLBUMES */
.home-container {
  display: grid;
  grid-template-columns: repeat(auto-fill, 260px);
  gap: 30px;
  padding: 40px;
  justify-content: flex-start;
}

.album-card {
  width: 260px;
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: 0.3s;
}

.album-card:hover {
  transform: scale(1.05);
}

.album-card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 8px;
}

/* GALERÍA */
.gallery-container {
  max-width: 1200px;
  margin: auto;
}

.back-btn {
  margin: 20px 0;
  padding: 10px 15px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

.photo {
  position: relative;
  break-inside: avoid;
  margin-bottom: 15px;
  cursor: pointer;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  transition: 0.3s;
}

/* HOVER */
.photo:hover img {
  transform: scale(1.05);
}

/* CHECKBOX */
.checkbox {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 26px;
  height: 26px;
  border: 2px solid white;
  border-radius: 6px;
  background: rgba(0,0,0,0.5);
  cursor: pointer;
  z-index: 3;
}

/* SELECCIÓN */
.photo.selected .checkbox {
  background: black;
}

.photo.selected .checkbox::after {
  content: "✔";
  color: white;
  position: absolute;
  top: 2px;
  left: 5px;
}

.photo.selected::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(255,0,0,0.4);
  border-radius: 12px;
  pointer-events: none;
}

/* CARRITO */
.cart {
  position: fixed;
  top: 20px;
  right: 20px;
  background: black;
  color: white;
  padding: 10px 15px;
  border-radius: 10px;
  font-weight: bold;
  z-index: 9999;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div class="cart" id="cart">🛒 0</div>

<div id="app"></div>

<div class="modal" id="modal">
  <img id="modalImg">
</div>

<script>

let seleccionadas = new Set();

function actualizarCarrito() {
  document.getElementById("cart").innerText = "🛒 " + seleccionadas.size;
}

/* ÁLBUMES */
async function mostrarAlbums() {
  const app = document.getElementById("app");

  const res = await fetch("/api/albums");
  const albums = await res.json();

  app.innerHTML = `<div class="home-container" id="albums"></div>`;
  const cont = document.getElementById("albums");

  for (const album of albums) {
    const fotos = await (await fetch(`/api/fotos/${album}`)).json();

    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <b>${album.replaceAll("_"," ")}</b>
      <div>${fotos.length} Fotos</div>
      <img src="/images/${album}/preview/${fotos[0]}">
    `;

    div.onclick = () => abrirAlbum(album);
    cont.appendChild(div);
  }
}

/* ABRIR ÁLBUM */
async function abrirAlbum(nombre) {
  const app = document.getElementById("app");

  const fotos = await (await fetch(`/api/fotos/${nombre}`)).json();

  app.innerHTML = `
    <div class="gallery-container">
      <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
      <div class="gallery" id="gallery"></div>
    </div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");
    img.src = `/images/${nombre}/preview/${foto}`;

    /* CLICK IZQUIERDO */
    div.addEventListener("click", (e) => {
      if (e.target.classList.contains("checkbox")) return;
      abrirModal(`/images/${nombre}/watermarked/${foto}`);
    });

    /* CLICK DERECHO */
    div.addEventListener("contextmenu", (e) => {
      e.preventDefault();

      if (div.classList.contains("selected")) {
        div.classList.remove("selected");
        seleccionadas.delete(foto);
      } else {
        div.classList.add("selected");
        seleccionadas.add(foto);
      }

      actualizarCarrito();
    });

    const checkbox = document.createElement("div");
    checkbox.className = "checkbox";

    checkbox.addEventListener("click", (e) => {
      e.stopPropagation();

      if (div.classList.contains("selected")) {
        div.classList.remove("selected");
        seleccionadas.delete(foto);
      } else {
        div.classList.add("selected");
        seleccionadas.add(foto);
      }

      actualizarCarrito();
    });

    div.appendChild(img);
    div.appendChild(checkbox);
    gallery.appendChild(div);
  });
}

/* MODAL */
function abrirModal(src) {
  const modal = document.getElementById("modal");
  const img = document.getElementById("modalImg");

  img.src = src;
  modal.style.display = "flex";

  modal.onclick = () => modal.style.display = "none";
}

/* BLOQUEAR CLICK DERECHO GLOBAL */
document.addEventListener("contextmenu", e => e.preventDefault());

mostrarAlbums();

</script>

</body>
</html>
