<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>@efe_produc</title>

<style>
body {
  margin: 0;
  background: #f5f5f5;
  font-family: Arial;
}

/* HEADER */
h1 {
  text-align: center;
  margin: 30px 0;
}

/* CONTENEDOR */
.container {
  max-width: 1200px;
  margin: auto;
  padding: 20px;
}

/* ALBUM CARD */
.album-card {
  background: white;
  border-radius: 15px;
  padding: 20px;
  margin-bottom: 30px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  cursor: pointer;
  transition: transform 0.2s;
}

.album-card:hover {
  transform: scale(1.02);
}

.album-card img {
  width: 100%;
  border-radius: 10px;
  margin-top: 10px;
}

.album-title {
  font-size: 22px;
  font-weight: bold;
}

.album-count {
  color: gray;
  margin-top: 5px;
}

/* BOTON VOLVER */
.back-btn {
  display: inline-block;
  margin-bottom: 20px;
  padding: 10px 15px;
  background: black;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

/* GRID PINTEREST */
.gallery {
  column-count: 4;
  column-gap: 15px;
}

@media (max-width: 1000px) {
  .gallery { column-count: 3; }
}
@media (max-width: 600px) {
  .gallery { column-count: 2; }
}

.photo {
  break-inside: avoid;
  margin-bottom: 15px;
}

.photo img {
  width: 100%;
  border-radius: 12px;
  transition: transform 0.3s;
  cursor: pointer;
}

.photo img:hover {
  transform: scale(1.05);
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  justify-content: center;
  align-items: center;
  z-index: 999;
}

.modal img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 12px;
}
</style>
</head>

<body>

<h1>@efe_produc</h1>

<div class="container" id="app"></div>

<!-- MODAL -->
<div class="modal" id="modal" onclick="cerrarModal()">
  <img id="modalImg">
</div>

<script>

// 📂 ÁLBUMES (EDITABLE)
const albums = [
  {
    nombre: "gymna_vs_cariocas",
    titulo: "FUTSAL TUCUMAN Fecha 3: Malvinas Argentinas vs Alianza"
  }
];

// 🏠 MOSTRAR ÁLBUMES
function mostrarAlbums() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  albums.forEach(album => {
    const div = document.createElement("div");
    div.className = "album-card";

    div.innerHTML = `
      <div class="album-title">${album.titulo}</div>
      <div class="album-count">Cargando...</div>
      <img src="/images/${album.nombre}/preview/1.jpg">
    `;

    // contar fotos automáticamente
    fetch(`/api/fotos/${album.nombre}`)
      .then(r => r.json())
      .then(fotos => {
        div.querySelector(".album-count").innerText = fotos.length + " Fotos";
      });

    div.onclick = () => abrirAlbum(album.nombre);

    app.appendChild(div);
  });
}

// 📸 ABRIR ÁLBUM
async function abrirAlbum(nombre) {
  const app = document.getElementById("app");

  const res = await fetch(`/api/fotos/${nombre}`);
  const fotos = await res.json();

  app.innerHTML = `
    <div class="back-btn" onclick="mostrarAlbums()">← Volver</div>
    <div class="gallery" id="gallery"></div>
  `;

  const gallery = document.getElementById("gallery");

  fotos.forEach(foto => {
    const div = document.createElement("div");
    div.className = "photo";

    const img = document.createElement("img");

    // 👇 SIN MARCA
    img.src = `/images/${nombre}/preview/${foto}`;

    // 👇 CON MARCA
    img.onclick = () => abrirModal(`/images/${nombre}/watermarked/${foto}`);

    div.appendChild(img);
    gallery.appendChild(div);
  });
}

// 🖼️ MODAL
function abrirModal(src) {
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalImg").src = src;
}

function cerrarModal() {
  document.getElementById("modal").style.display = "none";
}

// 🚀 INIT
mostrarAlbums();

</script>

</body>
</html>
